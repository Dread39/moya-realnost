<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Моя реальность</title>
<!-- В Telegram сюда добавляется: <script src="https://telegram.org/js/telegram-web-app.js"></script> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&family=Lora:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F2F4F3; --bg2:#E6EDEC; --ink:#0E1A1B; --muted:#55696A;
  --surface:rgba(255,255,255,.6); --surface2:rgba(255,255,255,.8); --solid:#FAFCFB;
  --line:rgba(12,60,64,.12); --edge:rgba(255,255,255,.8); --nav:rgba(242,244,243,.88); --scrim:rgba(10,24,26,.45);
  --grow:#0FA97E; --joy:#C98A1E; --love:#D8604A; --calm:#0E8FA8; --hard:#A0703F; --self:#6A4FC4;
  --cyan:#0E8FA8; --a1:rgba(15,169,126,.14); --a2:rgba(106,79,196,.12); --a3:rgba(14,143,168,.14);
  --gold-ink:#10190F; --glow:rgba(201,138,30,.2); --soft:rgba(14,143,168,.1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#02100F; --bg2:#04201F; --ink:#DFF6F4; --muted:#7FA9A8;
  --surface:rgba(10,42,44,.45); --surface2:rgba(14,54,56,.6); --solid:#061A1A;
  --line:rgba(80,230,225,.14); --edge:rgba(130,255,245,.16); --nav:rgba(2,16,15,.8); --scrim:rgba(0,0,0,.62);
  --grow:#4DE8B0; --joy:#FFC24B; --love:#FF7A5C; --calm:#38E1FF; --hard:#E0A26A; --self:#B48BFF;
  --cyan:#38E1FF; --a1:rgba(56,225,255,.16); --a2:rgba(180,139,255,.13); --a3:rgba(77,232,176,.14);
  --gold-ink:#0B1410; --glow:rgba(56,225,255,.26); --soft:rgba(56,225,255,.1);
}}
:root[data-theme="dark"]{
  --bg:#02100F; --bg2:#04201F; --ink:#DFF6F4; --muted:#7FA9A8;
  --surface:rgba(10,42,44,.45); --surface2:rgba(14,54,56,.6); --solid:#061A1A;
  --line:rgba(80,230,225,.14); --edge:rgba(130,255,245,.16); --nav:rgba(2,16,15,.8); --scrim:rgba(0,0,0,.62);
  --grow:#4DE8B0; --joy:#FFC24B; --love:#FF7A5C; --calm:#38E1FF; --hard:#E0A26A; --self:#B48BFF;
  --cyan:#38E1FF; --a1:rgba(56,225,255,.16); --a2:rgba(180,139,255,.13); --a3:rgba(77,232,176,.14);
  --gold-ink:#0B1410; --glow:rgba(56,225,255,.26); --soft:rgba(56,225,255,.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;min-height:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--joy);outline-offset:3px}
.c-joy{color:var(--joy)}.c-grow{color:var(--grow)}.c-love{color:var(--love)}.c-calm{color:var(--calm)}.c-hard{color:var(--hard)}.c-self{color:var(--self)}

.screen{display:none;width:100%;max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding:16px 16px 118px;
  background:radial-gradient(130% 55% at 50% 12%,var(--bg2) 0%,var(--bg) 72%)}
.screen.active{display:block}
.head{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 12px;gap:10px}
.head h1{font-family:Unbounded,sans-serif;font-size:22px;font-weight:700}
.head small{display:block;font-size:13px;color:var(--muted)}
.head .hello b{font-size:17px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--joy);background:var(--soft);border:1px solid var(--line);padding:7px 11px;border-radius:999px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 10px;gap:8px}
.sec h2{font-size:15px;font-weight:700}
.sec span,.sec button.link{font-size:12px;color:var(--muted);background:none;border:none}
.sec button.link{color:var(--joy);font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:12px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.muted{color:var(--muted)}
.btn{display:block;width:100%;border:none;border-radius:18px;padding:15px;font-weight:800;font-size:15px;background:var(--joy);color:var(--gold-ink);box-shadow:0 0 26px var(--glow)}
.btn[disabled]{opacity:.45;box-shadow:none}
.ghost{display:block;width:100%;border:1px solid var(--line);border-radius:18px;padding:14px;font-weight:700;font-size:15px;background:transparent}
.small-btn{border:none;border-radius:999px;padding:8px 13px;font-weight:800;font-size:13px;background:var(--joy);color:var(--gold-ink)}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;padding:26px 16px;color:var(--muted);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* чипы и выбор */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;background:transparent;border:1px solid var(--line);border-radius:14px;padding:9px 12px;text-align:left}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dot,var(--muted));flex:none}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--joy);color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{font-size:13px;font-weight:700;color:var(--muted);background:none;border:none;border-radius:10px;padding:9px 4px}
.seg button[aria-pressed="true"]{background:var(--joy);color:var(--gold-ink)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:13px 14px;margin-bottom:8px;font-size:15px;font-weight:600}
.opt small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.opt .dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--dot,var(--muted));box-shadow:0 0 8px var(--dot,transparent)}
.opt[aria-pressed="true"]{border-color:var(--joy);background:var(--soft)}
.opt .ck{margin-left:auto;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.opt[aria-pressed="true"] .ck{background:var(--joy);border-color:var(--joy);color:var(--gold-ink)}
.opt .ck svg{width:14px;height:14px;opacity:0}
.opt[aria-pressed="true"] .ck svg{opacity:1}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-size:15px;outline:none}
textarea.field{min-height:84px;resize:vertical;line-height:1.5}

/* задачи дня */
.task{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.tick{width:26px;height:26px;border-radius:9px;border:1.8px solid var(--muted);display:grid;place-items:center;flex:none;background:transparent;color:var(--gold-ink)}
.tick svg{width:15px;height:15px;opacity:0}
.task.done .tick{background:var(--joy);border-color:var(--joy)}
.task.done .tick svg{opacity:1}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:15px;font-weight:600}
.task.done .tx b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.task .tx small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:2px}
.task .tx small i{width:7px;height:7px;border-radius:50%;background:var(--dot)}
.task .x{background:none;border:none;color:var(--muted);font-size:18px;padding:4px 6px}
.main{display:flex;align-items:center;gap:14px;border-color:var(--joy)}
.main .ic{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,var(--joy),#E9A93A);color:var(--gold-ink)}
.main .ic svg{width:22px;height:22px}
.main .tx{flex:1;min-width:0}
.main small{font-size:12px;color:var(--muted)}
.main b{display:block;font-size:16px;font-weight:700;margin-top:2px;line-height:1.3}
.main .go{width:48px;height:48px;border-radius:50%;border:none;flex:none;background:var(--joy);color:var(--gold-ink);display:grid;place-items:center;box-shadow:0 0 24px var(--glow)}
.main .go svg{width:20px;height:20px}
.main.done{border-color:var(--grow)}
.main.done .go{background:var(--grow)}
.banner{border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.45;margin-bottom:12px;background:var(--soft);border:1px solid var(--line)}
.banner.calm{background:color-mix(in srgb,var(--calm) 14%,transparent)}
.banner button{margin-top:8px}

/* мир дня */
.world{position:relative;height:300px;margin:0 -16px}
.world canvas{width:100%;height:100%;display:block}
.world .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.world .n{font-family:Unbounded,sans-serif;font-weight:700;font-size:52px;line-height:1;text-shadow:0 0 30px var(--glow)}
.world .l{font-size:13px;color:var(--muted);margin-top:8px}
.world .lv{margin-top:8px;font-size:12px;font-weight:700;color:var(--joy)}
.moods{display:flex;gap:8px;justify-content:center;margin:0 0 14px}
.moods button{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.moods button[aria-pressed="true"]{color:var(--gold-ink);background:var(--joy);border-color:var(--joy)}

/* путь */
.goals{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.goals::-webkit-scrollbar{display:none}
.goalchip{flex:none;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px 8px 9px}
.goalchip i{width:10px;height:10px;border-radius:50%;background:var(--dot);box-shadow:0 0 8px var(--dot)}
.goalchip[aria-pressed="true"]{color:var(--ink);border-color:var(--dot);background:var(--soft)}
.mount{position:relative;overflow:hidden;height:390px;margin:0 -16px;overflow:hidden;border-radius:0 0 28px 28px}
.mount canvas{width:100%;height:100%;display:block}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:none;background:rgba(8,20,14,.74);color:#F4F1E6;border:1px solid rgba(243,190,78,.45);border-radius:12px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap;backdrop-filter:blur(8px)}
.pin small{display:block;font-size:11px;font-weight:500;color:rgba(244,241,230,.7)}
.pin:after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:rgba(8,20,14,.74);border-bottom:0}
.mount .ov{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;color:#F4F1E6}
.mount .ov b{font-family:Unbounded,sans-serif;font-size:30px;line-height:1;text-shadow:0 0 22px rgba(243,190,78,.35)}
.mount .ov small{display:block;font-size:12px;color:rgba(244,241,230,.72);margin-top:4px}
.camps{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 6px;padding:0 16px 4px;scrollbar-width:none}
.camps::-webkit-scrollbar{display:none}
.camp{flex:none;width:136px;border-radius:16px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:4px}
.camp small{font-size:11px;color:var(--muted)}
.camp b{font-weight:700;line-height:1.3}
.camp.done small{color:var(--joy)}
.camp.now{border-color:var(--joy);box-shadow:0 0 0 1px var(--joy) inset}
.camp.now small{color:var(--joy);font-weight:700}
.camp.next b{color:var(--muted)}
.camp button{margin-top:auto;border:none;border-radius:10px;padding:7px 8px;font-size:12px;font-weight:800;background:var(--joy);color:var(--gold-ink)}
.today{display:flex;gap:12px;align-items:center}
.today .tx{flex:1}
.today small{font-size:12px;color:var(--muted)}
.today b{display:block;font-size:16px;margin-top:2px;line-height:1.3}
.stepBtn{flex:none;width:64px;height:64px;border-radius:50%;border:none;background:var(--joy);color:var(--gold-ink);font-weight:800;font-size:12px;display:grid;place-items:center;box-shadow:0 0 28px var(--glow);line-height:1.1}
.stepBtn svg{width:22px;height:22px;display:block;margin:0 auto 2px}
.meter .rw{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.meter .rw span{color:var(--muted)}
.meter+.meter{margin-top:14px}
.track{height:8px;border-radius:4px;background:var(--line);margin-top:7px;overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;transition:width .9s cubic-bezier(.3,.8,.3,1)}
.ev{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:none;padding-bottom:0}
.ev:first-child{padding-top:0}
.ev .d{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;background:currentColor;box-shadow:0 0 8px currentColor}
.ev .tx{flex:1}
.ev b{font-size:14px;font-weight:700;color:var(--ink)}
.ev small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.ev time{font-size:12px;color:var(--muted);flex:none}
.lesson{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;padding:4px 8px;border-radius:9px;border:1px solid var(--line);color:var(--ink)}

/* звёзды */
.peakcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:10px}
.peakcard.closed{border-color:var(--joy);background:linear-gradient(135deg,var(--soft),var(--surface))}
svg.mini{width:62px;height:46px;flex:none}
.peakcard .tx{flex:1;min-width:0}
.peakcard b{font-size:15px;display:block}
.peakcard small{font-size:12px;color:var(--muted)}

/* история */
.book{position:relative;border-radius:26px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line);background:linear-gradient(160deg,#0F2A1D 0%,#0A1A12 55%,#1A1408 100%);color:#F4F1E6}
.book .in{position:relative;padding:18px 18px 16px 22px}
.book .spine{position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(#F3BE4E,#C98A1E)}
.book small{font-size:12px;color:rgba(244,241,230,.65)}
.book h2{font-family:Lora,serif;font-weight:500;font-size:25px;line-height:1.15;margin:6px 0 2px}
.book h2 em{color:#F3BE4E}
.book .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.book .nums div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:9px 4px;text-align:center}
.book .nums b{display:block;font-family:Unbounded,sans-serif;font-size:15px}
.book .nums span{font-size:10px;color:rgba(244,241,230,.65)}
.flow{position:relative;border-radius:22px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.flow canvas{display:block;width:100%;height:160px}
.flow .ft{display:flex;justify-content:space-between;padding:0 14px 12px;font-size:11px;color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 4px;padding:0 16px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.month h3{font-family:Lora,serif;font-weight:500;font-size:20px;margin:20px 2px 10px}
.e{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}
.e .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
.e .meta i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.e h4{font-size:15px;font-weight:700;line-height:1.35}
.e p{font-size:13px;color:var(--muted);line-height:1.5;margin-top:4px}
.e.peak{border-color:var(--joy);background:linear-gradient(135deg,var(--soft),var(--surface))}
.e q{display:block;font-family:Lora,serif;font-style:italic;font-size:17px;line-height:1.5;quotes:none}

/* профиль */
.portrait{position:relative;overflow:hidden;border-radius:26px;padding:18px;margin-bottom:12px;color:#F4F1E6;background:radial-gradient(120% 90% at 85% 0%,#2A3D62 0%,#0F1E2E 45%,#08140F 100%);border:1px solid var(--line)}
.portrait small{font-size:12px;color:rgba(244,241,230,.65)}
.portrait h3{font-family:Lora,serif;font-weight:500;font-size:23px;margin:6px 0 8px}
.portrait h3 em{color:#F3BE4E}
.portrait p{font-size:14px;line-height:1.55;color:rgba(244,241,230,.86)}
.portrait .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.portrait .tags span{font-size:12px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 10px}
.portrait .note{display:block;margin-top:10px;font-size:11px;color:rgba(244,241,230,.5)}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.2px 1.2px at 12% 20%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 12%,#fff9 50%,transparent 51%),radial-gradient(1.4px 1.4px at 88% 34%,#F3BE4E 50%,transparent 51%),radial-gradient(1px 1px at 40% 8%,#fff7 50%,transparent 51%),radial-gradient(1.2px 1.2px at 60% 26%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 22% 62%,#fff5 50%,transparent 51%),radial-gradient(1.3px 1.3px at 80% 70%,#fff6 50%,transparent 51%)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{border-radius:18px;padding:12px;background:var(--surface);border:1px solid var(--line)}
.st b{display:block;font-family:Unbounded,sans-serif;font-size:19px}
.st span{font-size:11px;color:var(--muted)}
.wheelBox{position:relative}
.wheelBox svg{display:block;width:100%;height:auto}
.wheelBox .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.wheelBox .mid b{display:block;font-family:Unbounded,sans-serif;font-size:24px}
.wheelBox .mid span{font-size:11px;color:var(--muted)}
.lbl{font-family:Manrope,sans-serif;font-size:10.5px;font-weight:700;fill:var(--muted);cursor:pointer}
.lbl.on{fill:var(--ink)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:18px;font-weight:700}
.stepper output{font-family:Unbounded,sans-serif;font-size:18px;min-width:28px;text-align:center}
.set{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);font-size:14px;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.set:last-child{border-bottom:none}
.set span{color:var(--muted);font-size:13px}
.sw{position:relative;width:46px;height:28px;border-radius:14px;background:var(--line);border:none;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--grow)}
.sw[aria-checked="true"]:after{transform:translateX(18px)}
.orb{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#FFE8B0,var(--joy) 45%,#6B4A10 100%);box-shadow:0 0 24px var(--glow)}

/* лист, чат, тост, вкладки */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:430px;max-height:88vh;overflow-y:auto;transform:translate(-50%,105%);visibility:hidden;transition:transform .36s cubic-bezier(.3,.8,.3,1),visibility 0s .36s;background:var(--solid);border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));z-index:41;border-top:1px solid var(--line)}
body.sheet-open .scrim{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:translate(-50%,0);visibility:visible;transition:transform .36s cubic-bezier(.3,.8,.3,1)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheetX{position:absolute;right:12px;top:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;color:var(--muted)}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:4px;line-height:1.25}
.sheet .lead{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.sheet label.q{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 8px}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:180px;max-height:48vh;overflow-y:auto;padding:6px 0 10px}
.m{max-width:86%;font-size:14px;line-height:1.5;padding:10px 12px;border-radius:16px;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--joy);color:var(--gold-ink);border-bottom-right-radius:6px}
.m.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.m.wait{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);opacity:0;background:var(--joy);color:var(--gold-ink);font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;transition:.35s;pointer-events:none;z-index:60;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;justify-content:space-around;padding:10px 6px calc(14px + env(safe-area-inset-bottom));background:var(--nav);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);background:none;border:none;padding:2px 6px;min-width:56px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--joy)}
body.onb .tabs,body.onb .screen{display:none!important}

/* онбординг */
#onb{display:none;max-width:430px;margin:0 auto;min-height:100vh;padding:18px 18px 28px;flex-direction:column;background:radial-gradient(120% 60% at 50% 0%,var(--bg2),var(--bg) 70%)}
body.onb #onb{display:flex}
.onbTop{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.onbTop button{background:none;border:none;color:var(--muted);font-size:14px;padding:4px 0}
.prog{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--joy);transition:width .4s}
.onbBody{flex:1}
.onbBody h2{font-family:Unbounded,sans-serif;font-size:23px;line-height:1.25;margin-bottom:8px}
.onbBody p.lead{font-size:14px;color:var(--muted);line-height:1.55;margin-bottom:18px}
.onbFoot{padding-top:14px}
.hero{height:230px;position:relative;margin:0 -18px 8px}
.hero canvas{width:100%;height:100%;display:block}
.suggest{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:14px;margin-bottom:10px;width:100%;text-align:left;display:block}
.suggest[aria-pressed="true"]{border-color:var(--joy);background:var(--soft)}
.suggest b{font-size:15px}
.suggest small{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.suggest .tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;margin-bottom:6px}
.suggest .tag i{width:8px;height:8px;border-radius:50%;background:currentColor}

/* празднование */
#celebrate{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none}
body.celebrating #celebrate{display:block}
body.celebrating .tabs{display:none}
#celebrate .wrap{max-width:430px;margin:0 auto;padding:14px 16px 40px}
#celebrate .stage{position:relative;height:440px;margin:0 -16px 14px;overflow:hidden;border-radius:0 0 28px 28px}
#celebrate .stage canvas{width:100%;height:100%;display:block}
#celebrate .post{position:absolute;left:0;right:0;bottom:20px;text-align:center;color:#F4F1E6;opacity:0;transform:translateY(10px);transition:opacity .8s,transform .8s;padding:0 20px}
#celebrate.won .post{opacity:1;transform:none}
#celebrate .post h1{font-family:Unbounded,sans-serif;font-size:30px;text-shadow:0 0 28px rgba(243,190,78,.4)}
#celebrate .post p{font-size:14px;color:rgba(244,241,230,.75);margin-top:8px}
#celebrate .rest{opacity:0;transform:translateY(14px);transition:opacity .9s .3s,transform .9s .3s}
#celebrate.won .rest{opacity:1;transform:none}
.bigstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.bigstats div{border-radius:18px;padding:12px 14px;background:var(--surface);border:1px solid var(--line)}
.bigstats b{display:block;font-family:Unbounded,sans-serif;font-size:21px}
.bigstats span{font-size:12px;color:var(--muted)}
.cbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cbar button{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--muted)}

@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast,.track i,#celebrate .post,#celebrate .rest{transition:none}}

/* ——— день: спокойная шапка ——— */
.dayTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 16px}
.dayTop .hi small{display:block;font-size:13px;color:var(--muted)}
.dayTop .hi b{font-size:20px;font-family:Unbounded,sans-serif;font-weight:700;letter-spacing:-.3px}
.dayTop .right{display:flex;align-items:center;gap:8px}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800}
.glowbg{position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:420px;height:300px;pointer-events:none;z-index:-1;
  background:radial-gradient(closest-side,var(--glow),transparent 70%);opacity:.5;transition:opacity .8s}
.blk{margin-bottom:8px}
.blkHead{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px}
.blkHead h2{font-size:14px;font-weight:800;letter-spacing:.2px}
.blkHead span{font-size:12px;color:var(--muted)}
.mainCard{border:1px solid var(--joy);background:linear-gradient(135deg,var(--soft),var(--surface))}
.sphdot{width:8px;height:8px;border-radius:50%;background:var(--dot);display:inline-block;flex:none}
.soulTask{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14px;border-bottom:1px solid var(--line)}
.soulTask:last-child{border-bottom:none}
/* ——— звёзды и мечты ——— */
.dreamcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:1px dashed var(--line);border-radius:20px;padding:13px;margin-bottom:9px}
.dreamcard b{font-size:15px}
.dreamcard small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.sum{display:flex;gap:8px;margin:0 2px 14px;font-size:13px;color:var(--muted)}
.sum b{color:var(--ink)}
/* ——— портрет ——— */
.pcard{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px;color:#F4F1E6;border:1px solid var(--line);
  background:radial-gradient(130% 100% at 80% 0%,#2E3B63 0%,#131F33 45%,#07130E 100%)}
.pcard .planet{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,232,176,.9),rgba(243,190,78,.55) 40%,rgba(120,80,20,.1) 70%);filter:blur(.3px);opacity:.75}
.pcard .pl-name{position:absolute;right:16px;top:64px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:rgba(244,241,230,.75)}
.pcard h3{font-family:Lora,serif;font-weight:500;font-size:23px;margin:4px 0 12px;position:relative}
.pcard h3 em{color:#F3BE4E}
.pcard .row2{position:relative;margin-bottom:12px}
.pcard .row2 b{display:block;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:rgba(244,241,230,.55);margin-bottom:3px}
.pcard .row2 p{font-size:14px;line-height:1.5;color:rgba(244,241,230,.9)}
.pcard .note{display:block;margin-top:10px;font-size:11px;color:rgba(244,241,230,.45);line-height:1.4;position:relative}
.pcard .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;position:relative}
.pcard .tags span{font-size:12px;font-weight:700;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:5px 10px}
/* ——— уроки и письма ——— */
.lessonCard{border-left:3px solid var(--hard);padding:10px 0 10px 12px;margin-bottom:10px}
.lessonCard b{font-size:14px;display:block}
.lessonCard small{font-size:13px;color:var(--muted);display:block;margin-top:3px}
.letter{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;background:var(--surface)}
.letter .ic{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--joy);display:grid;place-items:center;flex:none}
.letter b{font-size:14px}
.letter small{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* ——— аврора и зерно ——— */
#aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;background:var(--bg)}
#aurora i{position:absolute;display:block;border-radius:50%;filter:blur(60px);opacity:1;animation:drift 26s ease-in-out infinite}
#aurora i:nth-child(1){width:70vw;height:70vw;left:-20vw;top:-18vh;background:var(--a1)}
#aurora i:nth-child(2){width:64vw;height:64vw;right:-22vw;top:6vh;background:var(--a2);animation-duration:34s;animation-delay:-6s}
#aurora i:nth-child(3){width:78vw;height:78vw;left:-10vw;bottom:-24vh;background:var(--a3);animation-duration:40s;animation-delay:-14s}
#grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.32;mix-blend-mode:overlay;
  background-image:radial-gradient(circle at 25% 15%,rgba(255,255,255,.08) 0 1px,transparent 1px),radial-gradient(circle at 75% 65%,rgba(255,255,255,.06) 0 1px,transparent 1px);background-size:3px 3px,4px 4px}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(6vw,4vh,0) scale(1.12)}66%{transform:translate3d(-5vw,-3vh,0) scale(.95)}}
@media (prefers-reduced-motion:reduce){#aurora i{animation:none}}
.screen{background:transparent!important}
/* ——— стекло ——— */
.card,.peakcard,.suggest,.opt,.seg,.st,.flow,.letter{position:relative;background:var(--surface);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);
  border:1px solid var(--line);box-shadow:0 1px 0 var(--edge) inset,0 10px 30px rgba(0,0,0,.14)}
.card:before,.peakcard:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,0) 40%)}
.sheet{backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
/* ——— карта дня ——— */
.neuro{position:relative;height:320px;margin:0 -16px 2px;text-align:left}
.neuro canvas{width:100%;height:100%;display:block}
.neuro .mid{position:absolute;inset:0;pointer-events:none;text-align:center}
.neuro .n{position:absolute;left:16px;top:6px;font-family:Unbounded,sans-serif;font-weight:700;font-size:40px;line-height:1;letter-spacing:-2px;color:var(--ink)!important;-webkit-text-fill-color:var(--ink);text-shadow:0 0 26px var(--glow)}
.neuro .l{position:absolute;left:18px;top:50px;font-size:13px;color:var(--muted)}
.neuro .seal{position:absolute;left:18px;top:70px;font-size:12px;font-weight:800;color:var(--joy);opacity:0;transition:opacity .6s}
.neuro.sealed .seal{opacity:1}
.quote{font-family:Lora,serif;font-style:italic;font-size:15px;line-height:1.5;color:var(--muted);text-align:center;margin:14px 6px 2px}
/* ——— книга-читалка ——— */
#reader{position:fixed;inset:0;z-index:55;background:var(--bg);overflow-y:auto;display:none}
body.reading #reader{display:block}
body.reading .tabs{display:none}
#reader .wrap{max-width:430px;margin:0 auto;padding:12px 20px 60px}
#reader .rbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#reader .rbar button{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--muted)}
#reader h1{font-family:Lora,serif;font-weight:600;font-size:34px;line-height:1.15;margin:36px 0 6px;text-align:center}
#reader .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px}
#reader h2{font-family:Lora,serif;font-weight:500;font-size:24px;margin:34px 0 4px;border-bottom:1px solid var(--line);padding-bottom:8px}
#reader .rit{padding:14px 0;border-bottom:1px solid var(--line)}
#reader .rit:last-child{border-bottom:none}
#reader .rit small{font-size:12px;color:var(--muted)}
#reader .rit b{display:block;font-size:16px;margin:2px 0 3px}
#reader .rit p{font-size:14px;color:var(--muted);line-height:1.55}
#reader blockquote{font-family:Lora,serif;font-style:italic;font-size:16px;color:var(--joy);margin-top:8px}
#reader .end{margin:40px 0 0;text-align:center;font-family:Lora,serif;font-style:italic;color:var(--muted)}
/* ——— прочее ——— */
.bigbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--joy);border-radius:22px;padding:16px;background:linear-gradient(135deg,var(--soft),var(--surface));margin-bottom:12px}
.bigbtn .ic{width:44px;height:44px;border-radius:14px;background:var(--joy);color:var(--gold-ink);display:grid;place-items:center;flex:none}
.bigbtn b{display:block;font-size:16px}
.bigbtn small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.linkrow{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--surface);margin-bottom:10px;font-size:15px;font-weight:600}
.linkrow span{color:var(--muted);font-size:13px;font-weight:500}
.pcard{background:radial-gradient(130% 100% at 80% 0%,#25335C 0%,#111E2F 42%,#050F0D 100%)}
.pblock{position:relative;padding:12px 0;border-top:1px solid rgba(255,255,255,.08)}
.pblock:first-of-type{border-top:none}
.pblock b{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:rgba(244,241,230,.55);margin-bottom:4px}
.pblock p{font-size:14px;line-height:1.55;color:rgba(244,241,230,.9)}
.pyear{position:relative;margin-top:12px;border-radius:16px;padding:12px 14px;background:rgba(243,190,78,.14);border:1px solid rgba(243,190,78,.3)}
.pyear b{display:block;font-size:12px;color:#F3BE4E;margin-bottom:3px}
.pyear p{font-size:14px;color:rgba(244,241,230,.92);line-height:1.5}

/* голограмма */
.neuro .n{background:linear-gradient(180deg,var(--ink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 22px var(--glow))}
.mainCard{border-color:var(--cyan);background:linear-gradient(135deg,rgba(56,225,255,.10),var(--surface))}
.main .ic{background:linear-gradient(145deg,var(--cyan),#1FA8C4);color:#04201F}
.main .go{background:var(--cyan);color:#04201F;box-shadow:0 0 26px var(--glow)}
.main.done .go{background:var(--grow)}
.btn{background:linear-gradient(135deg,var(--cyan),#26C7DC);color:#04201F;box-shadow:0 0 28px var(--glow)}
.small-btn{background:var(--cyan);color:#04201F}
.tick{border-color:var(--muted)}
.task.done .tick{background:var(--cyan);border-color:var(--cyan);color:#04201F}
.pill{color:var(--cyan);background:var(--soft)}
.tab[aria-current="page"]{color:var(--cyan)}
.ring svg circle:last-child{stroke:var(--cyan)}
.moods button[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:#04201F}
.chip[aria-pressed="true"],.opt[aria-pressed="true"]{border-color:var(--cyan);background:var(--soft)}
.opt[aria-pressed="true"] .ck{background:var(--cyan);border-color:var(--cyan);color:#04201F}
.seg button[aria-pressed="true"]{background:var(--cyan);color:#04201F}
.bigbtn{border-color:var(--cyan);background:linear-gradient(135deg,rgba(56,225,255,.12),var(--surface))}
.bigbtn .ic{background:var(--cyan);color:#04201F}
.peakcard.closed,.e.peak{border-color:var(--joy);background:linear-gradient(135deg,rgba(255,194,75,.1),var(--surface))}

.brainArt{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:filter .8s ease,opacity 1.2s ease}
.brainArt svg{width:100%;height:100%;display:block}

@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}

.mount .pin{position:absolute;transform:translate(-50%,-100%)}

.mount #mountCv{position:absolute;inset:0;z-index:2;width:100%;height:100%}
.mount .pin,.mount .ov{z-index:3}

#netbg{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}
.dayCount{display:flex;align-items:baseline;gap:6px}
.dayCount b{font-family:Unbounded,sans-serif;font-size:28px;font-weight:700;letter-spacing:-1px;color:var(--cyan);text-shadow:0 0 22px var(--glow)}
.dayCount span{font-size:13px;color:var(--muted)}
.dayCount i{display:block;font-size:11px;font-weight:800;font-style:normal;color:var(--joy);margin-top:2px}
.mount{height:400px}

.nums4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.nums4 div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.nums4 b{display:block;font-family:Unbounded,sans-serif;font-size:26px;font-weight:700;color:var(--cyan);letter-spacing:-1px}
.nums4 span{font-size:12px;color:var(--muted)}

.recap{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.recap b{color:var(--ink)}
.nums4 button{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer}
.nums4 button:active{transform:scale(.98)}

.introArt{position:relative;height:0;overflow:hidden;opacity:0;transition:opacity .6s;margin:0 -22px 2px;background:#01050A}
#introCv{transition:opacity .55s ease}
.introArt.on{height:auto;aspect-ratio:1/1;opacity:1}
.introArt svg{width:100%;height:100%;display:block}
.introArt canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;transition:opacity .7s ease}
body.onb .onbBody h2{margin-top:8px}

.hintPill{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:#04201F;background:var(--cyan);
  border-radius:999px;padding:5px 11px;box-shadow:0 0 22px var(--glow)}

.blkHead h2{display:flex;align-items:center;gap:8px}
.blkHead .num{width:19px;height:19px;border-radius:6px;background:var(--cyan);color:#04201F;font-style:normal;
  font-size:11px;font-weight:800;display:inline-grid;place-items:center;flex:none}
.guide{border:1px solid var(--cyan);border-radius:20px;padding:16px;margin-bottom:16px;
  background:linear-gradient(135deg,rgba(56,225,255,.1),var(--surface))}
.guide>b{display:block;font-size:16px;margin-bottom:12px}
.gstep{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px;font-size:14px;line-height:1.45}
.gstep i{width:21px;height:21px;border-radius:50%;background:var(--cyan);color:#04201F;font-style:normal;
  font-size:12px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:1px}

/* подпись уводим вниз — рисунок созвездия должен быть виден */
.mount .ov{padding:10px 14px;left:10px;right:10px;top:auto;bottom:10px;border-radius:18px;
  background:linear-gradient(0deg,rgba(2,16,15,.78),rgba(2,16,15,.30));backdrop-filter:blur(6px)}
.mount .ov b{font-size:24px;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.mount .ov small{color:rgba(244,241,230,.85)}

/* ===== неделя, быстрый ввод, утренняя сборка ===== */
.viewSeg{margin:0 0 12px}
.qa{position:relative;margin-bottom:14px}
.qa .field{padding-right:48px}

const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const kdate=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=kdate(k);d.setDate(d.getDate()+n);return dkey(d)};
const daysBetween=(a,b)=>Math.round((kdate(b)-kdate(a))/864e5);
const ruDate=k=>{const d=kdate(k);return `${d.getDate()} ${MON_GEN[d.getMonth()]}`};
const monthName=k=>{const d=kdate(k);return `${MON_NOM[d.getMonth()]} ${d.getFullYear()}`};

/* ================= резервная копия в облаке Telegram =================
   Память браузера легко теряется: чистка кэша, новый телефон, переустановка.
   Поэтому состояние дублируется в CloudStorage Telegram — оно привязано
   к аккаунту и переживает смену устройства. Пишем кусками по 3500 символов. */
const CS=()=>{try{const c=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.CloudStorage;
  return (c&&c.setItem&&c.getItems)?c:null}catch(e){return null}};
const CHUNK=3500,CMAX=400;
let cloudT=null,cloudBusy=false;
function cloudQueue(){if(!CS())return;clearTimeout(cloudT);cloudT=setTimeout(cloudSave,20000)}   // не чаще раза в 20 секунд
function cloudSave(done){
  const c=CS();if(!c||cloudBusy)return done&&done(false);
  let raw;try{raw=JSON.stringify(S)}catch(e){return done&&done(false)}
  const parts=[];for(let i=0;i<raw.length;i+=CHUNK)parts.push(raw.slice(i,i+CHUNK));
  if(parts.length>CMAX)return done&&done(false);
  cloudBusy=true;
  const meta=JSON.stringify({n:parts.length,at:new Date().toISOString(),v:3});
  let left=parts.length,bad=false;
  const finish=()=>{cloudBusy=false;
    if(bad)return done&&done(false);
    c.setItem('mr_meta',meta,()=>{S.cloudAt=meta;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      done&&done(true)})};
  if(!parts.length)return finish();
  const WAVE=20;                                    // волнами, чтобы не упереться в лимиты Telegram
  const wave=st=>{
    const batch=parts.slice(st,st+WAVE);if(!batch.length)return;
    let n=batch.length;
    batch.forEach((v,j)=>c.setItem('mr_'+(st+j),v,err=>{
      if(err)bad=true;
      if(--left===0)finish();
      if(--n===0&&st+WAVE<parts.length)wave(st+WAVE);
    }));
  };
  wave(0);
}
function cloudLoad(done){
  const c=CS();if(!c)return done(null);
  c.getItem('mr_meta',(e,m)=>{
    if(e||!m)return done(null);
    let meta;try{meta=JSON.parse(m)}catch(x){return done(null)}
    if(!meta||!meta.n)return done(null);
    const keys=[];for(let i=0;i<meta.n;i++)keys.push('mr_'+i);
    const out=new Array(meta.n);let left=0,bad=false,fired=false;
    const assemble=()=>{
      if(fired)return;fired=true;
      if(bad||out.some(x=>x==null))return done(null);
      try{done({data:JSON.parse(out.join('')),at:meta.at})}catch(x){done(null)}};
    const batches=[];for(let i=0;i<keys.length;i+=40)batches.push(keys.slice(i,i+40));
    if(!batches.length)return assemble();
    left=batches.length;
    const guard=setTimeout(()=>{bad=true;assemble()},15000);   // облако не ответило — не зависаем
    batches.forEach(batch=>c.getItems(batch,(er,vals)=>{
      if(er||!vals)bad=true;
      else batch.forEach((k,j)=>{out[+k.slice(3)]=(vals[k]!=null?vals[k]:vals[j])});
      if(--left===0){clearTimeout(guard);assemble()}
    }));
  });
}

function carryFor(k){
  const d=S.days[k];if(!d)return [];
  const have=new Set(d.tasks.map(t=>t.text)),out=[];
  // смотрим неделю назад: пропущенный день не должен съедать незакрытые дела
  for(let i=1;i<=7;i++){const pd=S.days[addDays(k,-i)];if(!pd)continue;
    pd.tasks.forEach(t=>{
      if(t.status!=='moved'&&!(!t.status&&pd.closed))return;
      if(have.has(t.text))return;have.add(t.text);
      out.push({text:t.text,sphere:t.sphere||'home',type:t.type==='move'?'hold':t.type,goalId:t.goalId||null})})}
  return out;
}

function parseEntry(raw){
  let t=' '+String(raw||'').trim()+' ',date=null,rule=null,wd=null;
  const cut=re=>{const m=t.match(re);if(m){t=t.slice(0,m.index)+' '+t.slice(m.index+m[0].length);return m}return null};
  const Y=()=>kdate(today()).getFullYear();
  const mkDate=(y,mo,da)=>{                       // только реальные даты

    if(d.getMonth()+1!==mo||d.getDate()!==da)return null;

  // повтор
  if(cut(/\s(каждый день|ежедневно)\s/i))rule='daily';
  else if(cut(/\s(по будням|каждый будний день)\s/i))rule='weekdays';

    else{
      let m=cut(/\sчерез\s+(\d{1,3})\s*(?:дн|день|дня|дней)[а-яё]*\s/i);
      if(m)date=addDays(today(),Math.min(730,+m[1]));

      if(!date){const mm=t.match(/\s(?:в|во)\s+([а-яё]+)\s/i);
        if(mm){const w=mm[1].toLowerCase(),i=WD_SHORT.findIndex(a=>a.some(x=>w.startsWith(x)));

        if(mm){const y=mm[3]?(+mm[3]<100?2000+ +mm[3]:+mm[3]):Y();
          let k=mkDate(y,+mm[2],+mm[1]);
          if(k){if(!mm[3]&&k<today())k=mkDate(y+1,+mm[2],+mm[1]);
            if(k){date=k;t=t.slice(0,mm.index)+' '+t.slice(mm.index+mm[0].length)}}}}

  return{text,date:date||today(),rule,wd,sphere:text?guessSphere(text):(S.spheres[0]||'home')}}

  constructor(canvas){this.canvas=canvas;this.cx=canvas.getContext('2d');this.data=[];this.needSize=true;this.dots=Array.from({length:60},()=>({p:Math.random(),l:Math.floor(Math.random()*5),o:Math.random(),v:.0006+Math.random()*.0012}));SCENES.add(this)}

  x(i){const n=Math.max(2,this.data.length);return 14+(this.W-28)*i/(n-1)}

    const{cx,W,H}=this;if(!W||this.data.length<2)return;const C=palette();cx.clearRect(0,0,W,H);const L=this.layers();
    for(let k=0;k<5;k++){const top=L.map((m,i)=>[this.x(i),m[k][0]]),bot=L.map((m,i)=>[this.x(i),m[k][1]]).reverse();

      const g=cx.createLinearGradient(0,0,W,0);g.addColorStop(0,rgba(C[EMOS[k]],.3));g.addColorStop(1,rgba(C[EMOS[k]],.88));cx.fillStyle=g;cx.fill()}

class Neuro{
  constructor(canvas,artEl){this.canvas=canvas;this.cx=canvas.getContext('2d');this.art=artEl;this.needSize=true;
    this.nodes=BRAIN_PTS.map((p,i)=>({nx:p[0],ny:p[1],ph:i*1.7%6.28}));
    this.state=[];this.last=[];this.prev=[];this.target=5;this.sat=0;this.satTarget=0;
    this.flares=[];this.rings=[];this.sparks=[];this.sealed=false;this.t0=0;SCENES.add(this)}
  size(){if(!fitCanvas(this))return;this.needSize=false;
    const{W,H}=this,side=Math.min(W,H*1.0),ox=(W-side)/2,oy=(H-side)/2;
    this.nodes.forEach(n=>{n.x=ox+n.nx*side;n.y=oy+n.ny*side});
    if(this.last.length){this.prev=[];this.set(this.last,this.target)}}
  set(list,target){
    this.last=list;this.target=target||5;const N=this.nodes.length;if(!N)return;
    const spread=new Array(N).fill(null);
    if(list.length){const step=N/list.length;list.forEach((it,i)=>{spread[Math.min(N-1,Math.round(i*step+step*.5))]=it})}
    const st=spread.map(x=>x||{on:false,color:'grow'});
    st.forEach((s,i)=>{if(s.on&&!this.prev[i])this.fire(i)});
    this.prev=st.map(s=>s.on);this.state=st;
    const on=st.filter(s=>s.on).length;
    this.satTarget=clamp01(on/Math.max(1,this.target));
    if(on>=this.target&&!this.sealed){this.sealed=true;this.t0=performance.now()}
    if(on<this.target)this.sealed=false;
  }
  fire(i){const n=this.nodes[i];if(!n)return;
    this.rings.push({i,t:0});
    for(let k=0;k<14;k++){const a=Math.random()*6.283,sp=.6+Math.random()*2.4;
      this.sparks.push({x:n.x,y:n.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,i})}}
  draw(now){
    const{cx,W,H}=this;if(!W||!this.nodes[0]||this.nodes[0].x===undefined)return;
    const C=palette();C.self=rgb(cssv('--self'));C.cyan=rgb(cssv('--cyan'));
    this.sat+=(this.satTarget-this.sat)*.06;
    // сама картинка светлеет и насыщается по мере шагов
    if(this.art){const s=this.sat;
      this.art.style.filter=`brightness(${(.62+s*.55).toFixed(2)}) saturate(${(.9+s*.7).toFixed(2)}) drop-shadow(0 0 ${(10+s*26).toFixed(0)}px rgba(56,225,255,${(.18+s*.3).toFixed(2)}))`;
      this.art.style.opacity=REDUCE?1:(.82+.18*Math.abs(Math.sin(now/2600))).toFixed(2);}
    cx.clearRect(0,0,W,H);
    const lit=i=>this.state[i]&&this.state[i].on, colOf=i=>C[(this.state[i]&&this.state[i].color)||'grow']||C.grow;
    // фоновая жизнь: случайные вспышки по плате
    if(!REDUCE&&Math.random()<.07){const k=Math.floor(Math.random()*this.nodes.length);this.flares.push({i:k,t:0,idle:1})}
    this.flares=this.flares.filter(f=>f.t<1);
    this.flares.forEach(f=>{f.t+=.02;const n=this.nodes[f.i];if(!n)return;const a=Math.sin(f.t*Math.PI)*.45;
      const g=cx.createRadialGradient(n.x,n.y,0,n.x,n.y,26);g.addColorStop(0,rgba(C.cyan,a));g.addColorStop(1,rgba(C.cyan,0));
      cx.fillStyle=g;cx.beginPath();cx.arc(n.x,n.y,26,0,6.283);cx.fill()});
    // зажжённые контакты
    this.nodes.forEach((n,i)=>{if(!lit(i))return;const c=colOf(i),tw=REDUCE?1:.85+.15*Math.sin(now/700+n.ph);
      const g=cx.createRadialGradient(n.x,n.y,0,n.x,n.y,34*tw);g.addColorStop(0,rgba(c,.6));g.addColorStop(.4,rgba(c,.22));g.addColorStop(1,rgba(c,0));
      cx.fillStyle=g;cx.beginPath();cx.arc(n.x,n.y,34*tw,0,6.283);cx.fill();
      cx.fillStyle=rgba(c,.95);cx.beginPath();cx.arc(n.x,n.y,5.5*tw,0,6.283);cx.fill();
      cx.fillStyle='rgba(255,255,255,.9)';cx.beginPath();cx.arc(n.x,n.y,2.2,0,6.283);cx.fill()});
    // кольца при выполнении шага
    this.rings=this.rings.filter(r=>r.t<1);
    this.rings.forEach(r=>{r.t+=REDUCE?1:.022;const n=this.nodes[r.i];if(!n)return;const c=colOf(r.i);
      cx.strokeStyle=rgba(c,.6*(1-r.t));cx.lineWidth=3*(1-r.t)+.6;
      cx.beginPath();cx.arc(n.x,n.y,10+r.t*70,0,6.283);cx.stroke()});
    // искры
    this.sparks=this.sparks.filter(s=>s.l>0);
    this.sparks.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vx*=.94;s.vy*=.94;s.l-=.022;
      cx.fillStyle=rgba(colOf(s.i),Math.max(0,s.l));cx.beginPath();cx.arc(s.x,s.y,1.8,0,6.283);cx.fill()});
    // замыкание
    if(this.sealed){const t=(now-this.t0)/1700,k=clamp01(t),j=C.joy;
      if(t<1.5){const rad=Math.max(W,H)*k,g=cx.createRadialGradient(W/2,H*.5,rad*.55,W/2,H*.5,rad);
        g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.75,rgba(j,.34*(1-k)));g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H)}
      const p=REDUCE?.16:.1+.07*Math.sin(now/620);
      const g2=cx.createRadialGradient(W/2,H*.5,0,W/2,H*.5,Math.min(W,H)*.62);
      g2.addColorStop(0,rgba(j,p));g2.addColorStop(1,rgba(j,0));cx.fillStyle=g2;cx.fillRect(0,0,W,H)}
  }
}

function sk_spiral(cx,cy,r0,r1,a0,turns,dir,n){const o=[];

    const N=Math.round(W*3.2);
    for(let i=0;i<N;i++){
      let x,y;const pick=sk_rnd();
      if(pick<.40){const p=onArm();x=p[0];y=p[1]}
      else if(pick<.62){const c=cl[(sk_rnd()*cl.length)|0];
        const a=sk_rnd()*6.2832,dd=(sk_rnd()*sk_rnd())*c[2];x=c[0]+Math.cos(a)*dd;y=c[1]+Math.sin(a)*dd}
      else{x=sk_rnd()*W;y=sk_rnd()*H}
      if(x<-20||x>W+20||y<-20||y>H+20)continue;
      const m=sk_rnd(), r=m<.72?.35+sk_rnd()*.35:m<.94?.7+sk_rnd()*.5:1.2+sk_rnd()*.7;
      const al=m<.72?.20+sk_rnd()*.35:m<.94?.45+sk_rnd()*.35:.70+sk_rnd()*.30;
      g.fillStyle=skRGBA(TINT[(sk_rnd()*TINT.length)|0],al);
      g.beginPath();g.arc(x,y,r,0,6.2832);g.fill();
    }
    for(let i=0;i<9;i++){
      const x=W*(.06+sk_rnd()*.88),y=H*(.06+sk_rnd()*.88),r=1.1+sk_rnd()*.9,col=TINT[(sk_rnd()*4)|0];
      const gl=g.createRadialGradient(x,y,0,x,y,r*4.2);
      gl.addColorStop(0,skRGBA(col,.55));gl.addColorStop(.35,skRGBA(col,.12));gl.addColorStop(1,skRGBA(col,0));
      g.fillStyle=gl;g.beginPath();g.arc(x,y,r*4.2,0,6.2832);g.fill();
      g.fillStyle=skRGBA(col,.98);g.beginPath();g.arc(x,y,r*.8,0,6.2832);g.fill();
      const L=r*(7+sk_rnd()*5);
      for(const[dx,dy]of[[1,0],[0,1]]){
        const lg=g.createLinearGradient(x-dx*L,y-dy*L,x+dx*L,y+dy*L);
        lg.addColorStop(0,skRGBA(col,0));lg.addColorStop(.5,skRGBA(col,.48));lg.addColorStop(1,skRGBA(col,0));
        g.strokeStyle=lg;g.lineWidth=.7;

    this.live=[];sk_seed(4242);
    for(let i=0;i<54;i++)this.live.push({x:sk_rnd()*W,y:sk_rnd()*H,r:.5+sk_rnd()*.8,
      p:sk_rnd()*6.2832,s:900+sk_rnd()*1600,c:TINT[(sk_rnd()*TINT.length)|0]});
    this.keyBg=this.el+'|'+W+'x'+H;
  }

  figKey(){const n=(SKY_FIG[this.sign].m||[]).length;
    return this.sign+'|'+this.el+'|'+this.num+'|'+Math.round(this.pv*n)+'|'+Math.round(this.pv*12)+'|'+this.W+'x'+this.H}
  bakeFig(){
    const F=SKY_FIG[this.sign],E=SKY_EL[this.el],g=this.fgX,W=this.W,H=this.H;
    const d=Math.min(devicePixelRatio||1,1.75);
    if(!W||!H||!this.fg.width)return;
    g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,W,H);
    if(this.keyBg!==this.el+'|'+W+'x'+H)this.bakeBg();
    if(this.bg.width)g.drawImage(this.bg,0,0,W,H);          // фон и фигура — один слой, один blit в кадре
    if(!this.mold){
      const NS='http://www.w3.org/2000/svg';
      const sv=document.createElementNS(NS,'svg');sv.setAttribute('width','0');sv.setAttribute('height','0');
      sv.style.cssText='position:absolute;opacity:0;pointer-events:none';
      this.mold=document.createElementNS(NS,'path');sv.appendChild(this.mold);document.body.appendChild(sv);
    }
    const dFill=F.fill||'';
    this.mold.setAttribute('d',dFill);
    const bb=this.mold.getBBox();
    const PAD=Math.min(W,H)*.09, BOX=Math.min(W,H)-PAD*2;
    const sc=Math.min(BOX/Math.max(1,bb.width),BOX/Math.max(1,bb.height))*.98;
    const OX=(W-bb.width*sc)/2-bb.x*sc, OY=(H-bb.height*sc)/2-bb.y*sc;
    this.MS=F.m.map(([x,y])=>[OX+x*sc,OY+y*sc]);
    const lit=Math.round(this.pv*this.MS.length), R=Math.min(W,H)*.34;

    const SZ=260,oc=document.createElement('canvas');oc.width=oc.height=SZ;
    const o=oc.getContext('2d',{willReadFrequently:true});
    const k=SZ*.96/Math.max(bb.width,bb.height);
    const kx=(SZ-bb.width*k)/2-bb.x*k, ky=(SZ-bb.height*k)/2-bb.y*k;
    o.setTransform(k,0,0,k,kx,ky);o.lineJoin='round';o.lineCap='round';o.fillStyle='#fff';
    o.fill(new Path2D(dFill),'evenodd');
    o.setTransform(1,0,0,1,0,0);
    const px=o.getImageData(0,0,SZ,SZ).data, mB=new Uint8Array(SZ*SZ);
    for(let i=0;i<SZ*SZ;i++)mB[i]=px[i*4+3]>70?1:0;
    const erode=(src,r)=>{const t=new Uint8Array(SZ*SZ),out=new Uint8Array(SZ*SZ);
      for(let y=0;y<SZ;y++){const off=y*SZ;
        for(let x=0;x<SZ;x++){let v=1;
          for(let dd=-r;dd<=r&&v;dd++){const xx=x+dd;if(xx<0||xx>=SZ||!src[off+xx])v=0}
          t[off+x]=v}}
      for(let x=0;x<SZ;x++)for(let y=0;y<SZ;y++){let v=1;
        for(let dd=-r;dd<=r&&v;dd++){const yy=y+dd;if(yy<0||yy>=SZ||!t[yy*SZ+x])v=0}
        out[y*SZ+x]=v}
      return out};
    const rr=Math.max(1,Math.round(SZ/150));
    const E1=erode(mB,rr),E2=erode(E1,rr+1),E3=erode(E2,rr+2);
    const HA=.62,HX=Math.cos(HA),HY=Math.sin(HA),HB=HA+1.35,GX=Math.cos(HB),GY=Math.sin(HB);
    const u=SZ/100, hat=(x,y,st,w,cx2,cy2)=>{const v=((x*cx2+y*cy2)%st+st)%st;return v<w};
    const L_E=[],L_N=[],L_M=[],L_D=[];
    for(let i=0;i<SZ*SZ;i++){
      if(!mB[i])continue;const x=i%SZ,y=(i/SZ)|0;
      if(!E1[i]){L_E.push(x,y);continue}
      if(!E2[i]){if(hat(x,y,1.6*u,.85*u,HX,HY)||hat(x,y,2.6*u,.65*u,GX,GY))L_N.push(x,y);continue}
      if(!E3[i]){if(hat(x,y,2.0*u,.75*u,HX,HY))L_M.push(x,y);continue}
      if(hat(x,y,2.6*u,.7*u,HX,HY))L_D.push(x,y);
    }
    const s2s=(x,y)=>[OX+((x-kx)/k)*sc, OY+((y-ky)/k)*sc];
    const glow=this.pv*this.pv*this.pv*.55;
    const lightAt=(x,y)=>{let b=0;
      for(let m=0;m<lit;m++){const dx=x-this.MS[m][0],dy=y-this.MS[m][1],dd=Math.sqrt(dx*dx+dy*dy);
        if(dd<R){const t=1-dd/R,v=t*t*1.15;if(v>b)b=v}}
      return Math.min(1,Math.max(b,glow))};
    sk_seed(this.sign.length*104729+7);
    g.globalCompositeOperation='lighter';
    const pxs=sc/k, ghost=1+1.9*(1-this.pv);
    const LAY=[
      {L:L_E,n:2600,d:.85,j:.7, a0:.115,a1:.90,r0:.40,r1:.60,w:1},
      {L:L_N,n:3200,d:.62,j:1.0,a0:.055,a1:.56,r0:.34,r1:.50,w:.9},
      {L:L_M,n:3400,d:.58,j:1.5,a0:.040,a1:.34,r0:.32,r1:.48,w:.75},
      {L:L_D,n:4200,d:.55,j:2.0,a0:.030,a1:.24,r0:.30,r1:.46,w:.6},
      {L:L_E,n:1100,d:.40,j:5.0,a0:.028,a1:.22,r0:.30,r1:.50,w:.65}
    ];
    for(const S2 of LAY){
      const cnt=S2.L.length/2;if(!cnt)continue;
      const n=Math.min(S2.n,Math.max(50,Math.round(cnt*S2.d)));
      for(let i=0;i<n;i++){
        const q=(sk_rnd()*cnt|0)*2, p=s2s(S2.L[q],S2.L[q+1]);
        const gx=p[0]+(sk_rnd()*2-1)*S2.j*pxs, gy=p[1]+(sk_rnd()*2-1)*S2.j*pxs;
        const b=lightAt(gx,gy), a=S2.a0*ghost+S2.a1*b;
        if(a<.025)continue;
        const r=(S2.r0+sk_rnd()*(S2.r1-S2.r0))*(.8+b*.6);
        g.fillStyle=b>.6?skRGBA('#FFFFFF',a*S2.w):skRGBA(E.star,a*S2.w);
        g.beginPath();g.arc(gx,gy,r,0,6.2832);g.fill();
      }
    }
    /* печать силы — далёкое скопление в центре */
    const SG=SKY_SIGIL[this.num];
    if(SG){
      const S3=150,sc3=document.createElement('canvas');sc3.width=sc3.height=S3;
      const s3=sc3.getContext('2d',{willReadFrequently:true});
      s3.translate(S3/2,S3/2);s3.beginPath();SG(s3,S3*.46);
      s3.lineJoin='round';s3.lineCap='round';s3.strokeStyle='#fff';s3.lineWidth=2.2;s3.stroke();
      const q=s3.getImageData(0,0,S3,S3).data,hit=[];
      for(let y=0;y<S3;y++)for(let x=0;x<S3;x++)if(q[(y*S3+x)*4+3]>60)hit.push(x,y);
      const R2=Math.min(W,H)*.30, cnt=hit.length/2, K=Math.min(520,cnt);
      sk_seed(this.num*7919+3);
      for(let i=0;i<K;i++){
        const j=(sk_rnd()*cnt|0)*2;
        const x=W*.5+(hit[j]/S3-.5)*R2*2+(sk_rnd()*2-1)*2.2;
        const y=H*.5+(hit[j+1]/S3-.5)*R2*2+(sk_rnd()*2-1)*2.2;
        g.fillStyle=skRGBA(E.star,.06+.09*sk_rnd()+.05*this.pv);
        g.beginPath();g.arc(x,y,.35+sk_rnd()*.45,0,6.2832);g.fill();
      }
    }
    g.globalCompositeOperation='source-over';
    this.keyFg=this.figKey();
  }

  draw(now){
    const{cx,W,H}=this;if(!W||!H||!this.fg.width)return;
    this.tick=(this.tick|0)+1;
    if(!REDUCE&&this.tick%2&&!this.sparks.length&&!this.rings.length)return;   // 30 кадров в секунду хватает
    const E=SKY_EL[this.el];
    this.pv+=(this.p-this.pv)*(REDUCE?1:.06);
    if(Math.abs(this.p-this.pv)<.002)this.pv=this.p;
    if(this.keyBg!==this.el+'|'+W+'x'+H)this.bakeBg();
    if(this.keyFg!==this.figKey())this.bakeFig();
    cx.drawImage(this.fg,0,0,W,H);
    cx.globalCompositeOperation='lighter';
    if(!REDUCE)this.live.forEach(s=>{const t=.25+.55*(.5+.5*Math.sin(now/s.s+s.p));
      cx.fillStyle=skRGBA(s.c,t*.8);cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.2832);cx.fill()});
    const lit=Math.round(this.pv*this.MS.length);
    if(lit>0&&lit<this.MS.length){
      const a=this.MS[lit-1],b=this.MS[lit];
      const n=Math.min(60,Math.round(this.steps/Math.max(1,this.MS.length))+8);
      sk_seed(lit*31+7);
      for(let i=0;i<n;i++){
        const t=(i+.5)/n, jx=(sk_rnd()*2-1)*Math.min(W,H)*.022, jy=(sk_rnd()*2-1)*Math.min(W,H)*.022;
        const x=a[0]+(b[0]-a[0])*t+jx, y=a[1]+(b[1]-a[1])*t+jy;
        const tw=REDUCE?.7:.45+.45*Math.sin(now/900+i*1.7);
        cx.fillStyle=skRGBA(E.core,(.30+.40*tw)*(1-t*.35));
        cx.beginPath();cx.arc(x,y,.7+sk_rnd()*.5,0,6.2832);cx.fill();
      }
    }
    this.MS.forEach((p,i)=>{
      if(i>=lit)return;
      const r=Math.min(W,H)*.012*(1+i*.035), pu=REDUCE?1:1+.05*Math.sin(now/900+i*1.3);
      const sp=this.starSprite(r),R7=sp.width/2;
      cx.drawImage(sp,p[0]-R7,p[1]-R7);
      cx.fillStyle=skRGBA(E.core,.92);cx.beginPath();cx.arc(p[0],p[1],r*1.45*pu,0,6.2832);cx.fill();
      cx.fillStyle='rgba(255,255,255,.96)';cx.beginPath();cx.arc(p[0],p[1],r*.62*pu,0,6.2832);cx.fill();
      if(i===lit-1&&!REDUCE){cx.strokeStyle=skRGBA(E.core,.30+.16*Math.sin(now/700));cx.lineWidth=1.2;
        cx.beginPath();cx.arc(p[0],p[1],r*3.6,0,6.2832);cx.stroke()}
    });
    this.rings=this.rings.filter(r=>r.t<1);
    this.rings.forEach(r=>{r.t+=REDUCE?1:.02;
      cx.strokeStyle=skRGBA(E.core,.7*(1-r.t));cx.lineWidth=3*(1-r.t)+.5;
      cx.beginPath();cx.arc(r.x,r.y,10+r.t*70,0,6.2832);cx.stroke()});
    this.sparks=this.sparks.filter(s=>s.l>0);
    this.sparks.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.04;s.vx*=.97;s.l-=.02;
      cx.fillStyle=skRGBA(E.core,Math.max(0,s.l));cx.beginPath();cx.arc(s.x,s.y,1.8,0,6.2832);cx.fill()});
    cx.globalCompositeOperation='source-over';
  }
}

class Net{
  constructor(canvas){this.canvas=canvas;this.cx=canvas.getContext('2d');this.needSize=true;
    this.n=[];this.e=[];this.k=0;this.kT=0;this.wave=-1;SCENES.add(this)}
  size(){if(!fitCanvas(this))return;this.needSize=false;const{W,H}=this,r=rng(5);
    const N=Math.round(clamp01(W*H/300000)*34)+26;this.n=[];
    for(let i=0;i<N;i++)this.n.push({x:r()*W,y:r()*H,ph:r()*6.28,vx:(r()-.5)*.06,vy:(r()-.5)*.06});
    this.e=[];this.n.forEach((a,i)=>{this.n.map((b,j)=>({j,d:Math.hypot(a.x-b.x,a.y-b.y)}))
      .filter(o=>o.j!==i).sort((p,q)=>p.d-q.d).slice(0,2).forEach(o=>{if(!this.e.some(e=>e[0]===o.j&&e[1]===i))this.e.push([i,o.j])})})}
  set(k,seal){this.kT=clamp01(k);if(seal&&this.wave<0)this.wave=0;if(!seal)this.wave=-1}
  draw(now){const{cx,W,H}=this;if(!W)return;const C=palette();C.cyan=rgb(cssv('--cyan'));
    this.k+=(this.kT-this.k)*.05;cx.clearRect(0,0,W,H);
    this.n.forEach(p=>{if(REDUCE)return;p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1});
    const base=.04+this.k*.10;
    this.e.forEach(([i,j])=>{const a=this.n[i],b=this.n[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d>W*.42)return;const tw=REDUCE?.7:.5+.5*Math.sin(now/2400+a.ph);
      cx.strokeStyle=rgba(C.cyan,base*(.6+tw*.7));cx.lineWidth=1;
      cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()});
    this.n.forEach(p=>{const tw=REDUCE?.7:.5+.5*Math.sin(now/1800+p.ph);
      cx.fillStyle=rgba(C.cyan,(.09+this.k*.16)*(.5+tw*.6));
      cx.beginPath();cx.arc(p.x,p.y,1.5+this.k*1.2,0,6.283);cx.fill()});
    if(this.wave>=0&&this.wave<1.6){this.wave+=REDUCE?2:.016;const k=clamp01(this.wave),j=C.joy;
      const r=Math.max(W,H)*k*1.1,g=cx.createRadialGradient(W/2,H*.4,r*.6,W/2,H*.4,r);
      g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.8,rgba(j,.12*(1-k)));g.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=g;cx.fillRect(0,0,W,H)}}
}

/* Порядок — по частоте в опросах: здоровье и деньги впереди, дальше близкие,
   дом, учёба и развитие. Возраст двигает актуальное наверх, неактуальное убирает. */
const ONB_RANK=['form','sleep','save','income','close','debt','food','house','flat','fund',
  'trip','dreamtrip','learn','launch','grow','job','partner','car','exam','school','profession',
  'parents','repair','calm','lang','quit','hobby','friends','checkup','stories','wedding'];
function onbGoals(sph,birth){
  const age=ageOf(birth);
  let list=LIB.filter(t=>(!sph||!sph.length||sph.includes(t.s))&&ageFits(t,age));
  if(list.length<4)list=LIB.filter(t=>(!sph||!sph.length||sph.includes(t.s)));   // возраст не должен оставлять пустой экран
  if(list.length<4)list=LIB.filter(t=>ageFits(t,age));
  if(!list.length)list=LIB.slice();
  return list.map(t=>{const i=ONB_RANK.indexOf(t.id);
    let sc=100-(i<0?99:i);
    if(agePeak(t,age))sc+=10;                      // возраст, в котором цель самая живая
    return{t,sc}}).sort((a,b)=>b.sc-a.sc).slice(0,10).map(x=>x.t)}

/* ——— титульная страница книги: кто этот человек и что он уже прошёл ——— */
function bookCover(p,days,cl,ls){
  const nm=esc(S.profile.name||'');
  const steps=totalDone(),notes=Object.values(S.days||{}).reduce((a,d)=>a+((d.notes||[]).length),0);
  let h=`<div class="cover">`;
  if(p&&SIGN2KEY[p.sign])h+=`<div class="coverSky"><canvas id="coverCv"></canvas></div>`;
  h+=`<div class="nm">${nm}</div>`;
  if(p){
    h+=`<div class="ln">${esc(p.day)} ${S.profile.birth.slice(0,4)} · ${esc(p.sign)} · ${esc(p.elName)}${p.age?` · ${p.age} ${word(p.age,['год','года','лет'])}`:''}</div>`;
    h+=`<div class="ln2">Число пути ${p.num} — ${esc(p.numName)}</div>`;
  }else{
    h+=`<div class="ln">Дата рождения не указана</div>`;
  }
  // характер — из портрета, коротко и без гадания
  if(p)h+=`<p class="ch">${esc(p.soul)} ${esc(p.strong)}</p>`;
  // путь: только если он есть
  if(days>0&&(steps||cl.length)){
    h+=`<div class="pth"><b>${rankName(cl.length)}</b><span>${days} ${word(days,W_DAY)} в пути</span></div>`;
    h+=`<div class="cnums">
      <span><b>${fmtN(steps)}</b>${word(steps,W_STEP)}</span>
      <span><b>${cl.length}</b>${word(cl.length,W_PEAK)}</span>
      <span><b>${ls.length}</b>${word(ls.length,['урок','урока','уроков'])}</span>
      ${notes?`<span><b>${notes}</b>${word(notes,['заметка','заметки','заметок'])}</span>`:''}</div>`;
    const first=cl[0],last=ls[ls.length-1];
    let line=`За ${days} ${word(days,W_DAY)} я сделал ${fmtN(steps)} ${word(steps,W_STEP)}`;
    if(cl.length)line+=`, зажёг ${cl.length} ${word(cl.length,W_PEAK_A)}`;
    if(ls.length)line+=` и вынес ${ls.length} ${word(ls.length,['урок','урока','уроков'])}`;
    h+=`<p class="say">${line}. Вот как это было.</p>`;
    if(first&&first.words)h+=`<blockquote class="cq">«${esc(first.words)}»</blockquote>`;
    else if(last)h+=`<blockquote class="cq">«${esc(last.text||last.title)}»</blockquote>`;
  }else{
    h+=`<div class="pth"><b>Начало</b><span>путь ещё впереди</span></div>
      <p class="say">Здесь пока пусто — и это нормально. Каждый отмеченный шаг станет строчкой в этой книге.</p>`;
    if(p)h+=`<blockquote class="cq">${esc(p.move)}</blockquote>`;
  }
  return h+`</div>`;
}

function bindOnb(){
  const d=ui.od,upd=()=>{const st=ONB[ui.onb];$('#onbNext').disabled=st.req?!st.req(d):false;if(st.k==='birth')$('#onbNext').textContent=d.birth?'Дальше':'Пропустить'};
  const n=$('#fName');if(n){n.oninput=()=>{d.name=n.value;upd()};setTimeout(()=>n.focus(),60)}
  const b=$('#fBirth');if(b)b.oninput=()=>{d.birth=b.value;upd()};
  const dw=$('#fDream');if(dw)dw.oninput=()=>{d.ownDream=dw.value;upd()};
  const rs=$('#fRestore');if(rs)rs.oninput=()=>{d.ownRestore=rs.value;upd()};
  const wh=$('#fWho');if(wh)wh.oninput=()=>{d.ownWho=wh.value;upd()};
  const sg=$('#fStage');if(sg)sg.oninput=()=>{d.ownStage=sg.value;upd()};
  $$('#onbBody [data-group] [data-v]').forEach(btn=>btn.onclick=()=>{

    const vals=pickIn(box,btn,multi,+box.dataset.max||0,box.dataset.msg);if(!vals)return;
    if(key.startsWith('dir:'))d.dirs[key.slice(4)]=vals[0];
    else if(key==='who'){
      // «Живу один» — отдельный выбор: снимает остальные и снимается сам
      if(btn.dataset.v==='alone'&&vals.includes('alone')){d.who=['alone'];renderOnb();return}
      d.who=vals.filter(v=>v!=='alone');
    }
    else if(key==='restore')d.restore=vals;
    else if(key==='goals'){d.goals=vals;return renderOnb()}
    else if(key==='spheres'){d.spheres=vals;return renderOnb()}
    else{d[key]=vals[0];if(key==='dream'||key==='spheres'||key==='stage')return renderOnb()}
    upd();
  });
}

function finishOnb(){

    restore:d.restore.concat(d.ownRestore?['own']:[]),ownRestore:d.ownRestore||'',ownWho:d.ownWho||'',ownStage:d.ownStage||''};
  S.spheres=d.spheres;S.dirs=d.dirs;S.created=today();S.onboarded=true;
  // выбранные цели сразу становятся звёздами с вехами
  d.goals=d.goals.slice(0,LIMITS.goals);
  const own0=(d.ownDream||'').trim();
  if(own0&&d.goals.length>=LIMITS.goals)d.goals=d.goals.slice(0,LIMITS.goals-1);
  d.goals.forEach(id=>{const t=LIBO[id];if(!t)return;
    createGoal(t,{});
    S.dirs[t.s]=S.dirs[t.s]||t.dir;});
  if(own0){const sp=d.spheres[0]||'home',nm=own0[0].toUpperCase()+own0.slice(1);
    createGoal({n:nm,s:sp,st:['Решение принято','Первые шаги сделаны','Половина пути','Почти у цели','Звезда'],sp:[]},{});}
  const first=activeGoals()[0];
  if(first)S.active=first.id;
  const t0=LIBO[d.goals[0]];
  S.profile.dream=(t0&&t0.dream&&t0.dream.length)?t0.dream[0]:'';
  // первый шаг уже на сегодня — человек выходит не в пустой лист
  const sg=suggestMain();
  if(sg)addTask(getDay(today()),{text:sg.text,sphere:sg.sphere,goalId:sg.goalId,type:'move'});
  save();haptic('success');chime(true);go('day');
}

   <div class="right">${isT?`<button class="bookBtn" data-act="openReader" aria-label="Книга жизни">${ICON.book}</button>`:`<button class="bookBtn" data-act="toToday" aria-label="Сегодня">${ICON.sun}</button>`}
    <div class="dayCount"><span class="n"><b>${done}</b><span>из ${Math.max(target,tasks.length)}</span></span>${isT&&s?`<i>${s} ${word(s,W_DAY)} подряд</i>`:''}</div></div>`;
  if(ui.dayView==='week')return renderWeek();
  let h=viewSwitch();

  h+=`<div class="page">`;
  // ---- дела дня: то, что закрываем обязательно ----
  h+=secHead('Дела дня', hold.length?`${hold.filter(t=>t.status==='done').length} из ${hold.length}`:'',
    `<button class="secBtn" data-act="repList" aria-label="Повторяющиеся дела">${ICON.rep}${(S.repeats||[]).length?`<b>${S.repeats.length}</b>`:''}</button>`);
  h+=hold.map(t=>lineRow(t)).join('');
  if(!day.closed)h+=addLine('hold','Добавить дело','Что нужно сделать?');
  if(q.length&&!day.closed)h+=`<button class="line sug" data-act="moment0"><span class="bx">${ICON.rep}</span><span class="tx">Собрать день<em>${q.length} ${word(q.length,['предложение','предложения','предложений'])} — по одному</em></span><i>›</i></button>`;
  h+=blank(Math.max(0,2-hold.length));
  // ---- цели ----
  h+=secHead('Цели', main?(main.status==='done'?'шаг сделан':''):'');
  if(!act.length)h+=`<button class="line add" data-act="addGoal"><span class="bx">${ICON.plus}</span><span class="tx">Выбрать свою цель</span></button>`;
  else if(main)h+=lineRow(main,goalById(main.goalId));
  else{const sg=suggestMain(),g=sg?goalById(sg.goalId):null;
    if(sg)h+=`<button class="line add" data-act="takeMain"><span class="bx">${ICON.plus}</span><span class="tx">${esc(sg.text)}<em>${esc(g?g.name:'')}</em></span></button>
        <button class="line sub" data-act="pickMain"><span class="tx">Другой шаг</span><i>›</i></button>`}
  // ---- для души ----
  h+=secHead('Для души','что порадует');
  h+=soul.map(t=>lineRow(t)).join('');
  if(!day.closed)h+=addLine('soul','Добавить','Что порадует?');
  h+=blank(Math.max(0,1-soul.length));
  // ---- заметка ----
  h+=secHead('Заметка','своими словами');
  h+=(day.notes||[]).map((n,i)=>`<div class="line note"><span class="tx">${esc(n.t)}<em>${esc(n.at||'')}</em></span><button class="rm" data-act="noteDel" data-i="${i}" aria-label="Убрать">×</button></div>`).join('');
  h+=`<button class="line add" data-act="noteAdd"><span class="bx">${ICON.mic}</span><span class="tx">${(day.notes||[]).length?'Ещё заметка':'Надиктовать или написать'}</span></button>`;
  h+=blank((day.notes||[]).length?0:1);
  h+=`</div>`;
  const fb=isT?flashback():null;
  if(fb)h+=`<button class="flash" data-act="openReader"><span class="fl">${esc(fb.when)}</span><b>${esc(fb.title)}</b>${fb.text?`<small>${esc(fb.text)}</small>`:''}</button>`;
  $('#dayBody').innerHTML=h;
}
/* одна запись из прошлого, раз в день: перечитывать архив сами люди не ходят */
function flashback(){
  const t=today();if(S.flashDay===t)return S.flash||null;
  const marks=[[365,'Год назад'],[180,'Полгода назад'],[90,'Три месяца назад'],[30,'Месяц назад']];
  let hit=null;
  for(const[n,lab]of marks){const k=addDays(t,-n);
    const d=S.days&&S.days[k];
    if(d&&d.notes&&d.notes.length){hit={when:lab,title:d.notes[0].t,text:''};break}
    const f=(S.feed||[]).filter(x=>x.date===k&&(x.type==='note'||x.type==='moment'||x.type==='peak'||x.type==='lesson'))[0];
    if(f){hit={when:lab,title:f.title,text:f.text||''};break}}
  if(!hit){                                          // нет ровной даты — берём случайное из давнего
    const pool=(S.feed||[]).filter(x=>x.date<addDays(t,-21)&&(x.type==='note'||x.type==='moment'||x.type==='lesson'||x.type==='peak'));
    if(pool.length){const f=pool[(kdate(t).getDate()*7)%pool.length];
      hit={when:ruDate(f.date),title:f.title,text:f.text||''}}}
  S.flashDay=t;S.flash=hit;save();return hit;
}

    <button class="inlGo" data-act="inlSave" data-y="${y}" aria-label="Записать">${ICON.check}</button></div>
    <button class="line sub" data-act="pickTask" data-y="${y}"><span class="tx">Выбрать из готовых</span><i>›</i></button>`;
  return `<button class="line add" data-act="inlOpen" data-y="${y}"><span class="bx">${ICON.plus}</span><span class="tx">${label}</span></button>`}

function weekStart(k){const d=kdate(k),w=(d.getDay()+6)%7;return addDays(k,-w)}
function renderWeek(){
  const k=today(),w0=addDays(weekStart(k),(ui.wkOff||0)*7),days=[];
  for(let i=0;i<7;i++)days.push(addDays(w0,i));
  let h=viewSwitch();
  const total=days.reduce((a,x)=>{const d=peekDay(x);return a+(d?d.tasks.filter(t=>t.status==='done').length:0)},0);
  const off=ui.wkOff||0;
  h+=`<div class="wkTop"><button class="wkNav" data-act="wkShift" data-v="-1" aria-label="Прошлая неделя">‹</button>
    <span class="wkTitle"><b>${ruDate(w0)} — ${ruDate(days[6])}</b><i>${off?(off<0?'прошлая неделя':'следующая неделя'):`${total} ${word(total,W_STEP)} за неделю`}</i></span>
    <button class="wkNav" data-act="wkShift" data-v="1" aria-label="Следующая неделя">›</button></div>`;
  h+=`<div class="wk">`+days.map(x=>{
    const d=peekDay(x),dd=kdate(x),isT=x===k,past=x<k;
    let ts=d?d.tasks.slice():[];
    // будущие дни ещё не созданы — показываем, что в них придёт по повторам
    if(x>=k)(S.repeats||[]).forEach(r=>{if(repHits(r,x)&&!ts.some(t=>t.text===r.text))ts.push({text:r.text,sphere:r.sphere,status:null})});
    const lines=ts.slice(0,7).map(t=>`<li class="${t.status==='done'?'d':t.status==='fail'?'f':''}">${t.status==='done'?'✓':t.status==='fail'?'×':'·'} ${esc(t.text)}</li>`).join('');
    const more=ts.length>7?`<li class="mr">+${ts.length-7}</li>`:'';
    const fill=Math.max(0,3-ts.length);
    return `<button class="wkd ${isT?'now':''} ${past?'past':''}" data-act="wkOpen" data-k="${x}">
      <span class="wkdD"><i>${WD2[dd.getDay()]}</i><b>${dd.getDate()}</b></span>
      <ul class="wkdL">${lines||''}${more}${Array(fill).fill('<li class="em"></li>').join('')}</ul></button>`}).join('')+`</div>`;
  $('#dayBody').innerHTML=h;
}

function momentQueue(){
  const d=getDay(today()),have=new Set(d.tasks.map(t=>t.text)),q=[];

  let pts=0,moved=0;
  d.tasks.forEach(t=>{if(t.status==='done'){pts+=2;return}
    if(!t.status){t.status='moved';moved++;pts+=1}});

function mountSwipe(n){
  const el=$('.mount');if(!el)return;
  if(el.dataset.sw)return;el.dataset.sw='1';
  let x0=null,y0=null,moved=false,lastTouch=0,lastAct=0;
  const act=d=>{const n=Date.now();if(n-lastAct<450)return;lastAct=n;shiftGoal(d)};
  const start=e=>{const t=e.touches?e.touches[0]:e;x0=t.clientX;y0=t.clientY;moved=false};
  const move=e=>{if(x0==null)return;const t=e.touches?e.touches[0]:e;
    if(Math.abs(t.clientX-x0)>12&&Math.abs(t.clientX-x0)>Math.abs(t.clientY-y0))moved=true};
  const end=e=>{
    if(e.type==='touchend')lastTouch=Date.now();
    else if(Date.now()-lastTouch<700){x0=null;return}      // тач уже обработан, мышиный дубль игнорируем
    if(x0==null)return;
    const t=(e.changedTouches?e.changedTouches[0]:e),dx=t.clientX-x0,dy=t.clientY-y0;
    x0=null;
    if(activeGoals().length<2)return;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))act(dx<0?1:-1);
    else if(!moved&&!e.target.closest('[data-act]'))act(1);};
  el.addEventListener('touchstart',start,{passive:true});
  el.addEventListener('touchmove',move,{passive:true});
  el.addEventListener('touchend',end);
  el.addEventListener('mousedown',start);el.addEventListener('mousemove',move);el.addEventListener('mouseup',end);
}

function flowData(){
  const start=S.created||today(),span=daysBetween(start,today())+1,byWeek=span>21;
  const n=byWeek?Math.min(16,Math.ceil(span/7)):Math.max(7,Math.min(21,span)),unit=byWeek?7:1,buckets=[];
  for(let i=0;i<n;i++)buckets.push([0,0,0,0,0]);
  const idx=k=>{const b=n-1-Math.floor(daysBetween(k,today())/unit);return b>=0&&b<n?b:-1};
  const EM=['grow','joy','love','calm','hard'];
  Object.entries(S.days).forEach(([k,d])=>{const b=idx(k);if(b<0)return;d.tasks.forEach(t=>{if(t.status==='done'){const s=SPH[t.sphere];if(s)buckets[b][EM.indexOf(t.type==='soul'?'calm':s.emo)]++}})});
  const peaks=[];S.feed.forEach(f=>{const b=idx(f.date);if(b<0)return;buckets[b][EM.indexOf(f.kind||'grow')]+=f.type==='lesson'?1.5:1;if(f.type==='peak')peaks.push(b)});
  return{data:buckets.map(x=>x.map(v=>v+.15)),peaks,label:byWeek?`${n} недель`:`${n} ${word(n,W_DAY)}`};
}

function bookHtml(){
  const o=ui.ex,from=o.period==='Месяц'?addDays(today(),-31):o.period==='Год'?addDays(today(),-366):'0000';
  let items=S.feed.filter(x=>x.date>=from);
  if(o.who==='family')items=items.filter(x=>x.type!=='money'&&x.type!=='thought');
  if(o.who==='kid')items=items.filter(x=>['peak','lesson','moment'].includes(x.type));
  const col={joy:'#C98A1E',grow:'#2F7A55',love:'#D0644F',calm:'#3B7FA8',hard:'#9A6A43'};
  const gr={};items.sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{(gr[monthKey(x.date)]=gr[monthKey(x.date)]||[]).push(x)});
  const ls=lessonsList();
  const chapters=Object.keys(gr).map(m=>`<section><h2>${monthName(m+'-01')}</h2>${gr[m].map(x=>`<div class="it" style="border-color:${col[x.kind]||'#999'}"><small>${ruDate(x.date)}</small><h3>${esc(x.title)}</h3>${x.text?`<p>${esc(x.text)}</p>`:''}${x.words?`<blockquote>«${esc(x.words)}»</blockquote>`:''}</div>`).join('')}</section>`).join('');
  const letters=S.letters.length&&o.who!=='family'?`<section><h2>Письма</h2>${S.letters.map(l=>`<div class="it" style="border-color:#C98A1E"><small>написано ${ruDate(l.date)}</small><h3>${esc(l.to)}</h3><p>${esc(l.text)}</p></div>`).join('')}</section>`:'';
  const lessons=ls.length?`<section><h2>Мои уроки</h2>${ls.map(l=>`<div class="it" style="border-color:#9A6A43"><h3>${esc(l.title)}</h3><p>${esc(l.text)}</p></div>`).join('')}</section>`:'';
  const days=S.created?daysBetween(S.created,today())+1:0;
  return `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Книга жизни — ${esc(S.profile.name)}</title><style>body{font-family:Georgia,serif;max-width:720px;margin:0 auto;padding:40px 24px;color:#1c241f;background:#faf7f0;line-height:1.6}.cover{text-align:center;padding:70px 20px;border-bottom:2px solid #C98A1E;margin-bottom:36px}.cover h1{font-size:42px;margin:0}.cover .bio{font-size:14px;color:#8a7f6a;margin:10px 0 0}.cover .ch{font-size:15px;line-height:1.6;max-width:30em;margin:12px auto 0;color:#3a4440}.nums{display:flex;justify-content:center;gap:26px;margin-top:22px;font-family:system-ui}.nums b{display:block;font-size:26px;color:#C98A1E}h2{font-size:26px;margin:38px 0 14px;border-bottom:1px solid #ddd;padding-bottom:6px}.it{border-left:4px solid;padding:6px 0 6px 14px;margin:0 0 16px;page-break-inside:avoid}.it small{color:#888;font-family:system-ui}.it h3{margin:2px 0;font-size:18px}.it p{margin:2px 0;color:#444}blockquote{font-style:italic;margin:6px 0 0;color:#8a5f14}.end{margin-top:50px;text-align:center;color:#8a5f14;font-style:italic}</style></head><body>
  <div class="cover"><p>Книга жизни</p><h1>${esc(S.profile.name)}</h1>
  ${(()=>{const q=portrait(S.profile);return q?`<p class="bio">${esc(q.day)} ${S.profile.birth.slice(0,4)} · ${esc(q.sign)} · ${esc(q.elName)}${q.age?` · ${q.age} ${word(q.age,['год','года','лет'])}`:''}<br>Число пути ${q.num} — ${esc(q.numName)}</p><p class="ch">${esc(q.soul)} ${esc(q.strong)}</p>`:''})()}
  <p>${o.who==='kid'?'Тому, кто пойдёт следом':o.period==='Всё'?'Весь путь':o.period==='Год'?'Последний год':'Последний месяц'}</p>
  <div class="nums"><div><b>${days}</b>дней пути</div><div><b>${fmtN(totalDone())}</b>шагов</div><div><b>${closedGoals().length}</b>звёзд</div><div><b>${ls.length}</b>уроков</div></div></div>
  <p>За это время я сделал ${fmtN(totalDone())} шагов, зажёг ${closedGoals().length} ${word(closedGoals().length,W_PEAK_A)} и прошёл ${ls.length} ${word(ls.length,['трудность','трудности','трудностей'])}. Вот как это было.</p>
  ${chapters||'<p>Пока пусто — история начинается.</p>'}${lessons}${letters}
  <p class="end">${esc(S.profile.name)} · день за днём. Если ты её читаешь — значит, путь имел смысл.</p></body></html>`;
}
A.buildBook=async()=>{const html=bookHtml();haptic('success');
