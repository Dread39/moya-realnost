<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Моя реальность</title>
<meta name="theme-color" content="#06120C">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&family=Lora:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F4F0E6; --bg2:#EAE4D6; --surface:rgba(255,255,255,.7); --solid:#FBF8F1; --line:rgba(40,60,45,.13);
  --ink:#16261C; --muted:#5E6E63; --gold-ink:#1A1206; --nav:rgba(244,240,230,.9); --scrim:rgba(20,30,24,.45);
  --joy:#C98A1E; --grow:#2F7A55; --love:#D0644F; --calm:#3B7FA8; --hard:#9A6A43;
  --glow:rgba(201,138,30,.24); --soft:rgba(201,138,30,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06120C; --bg2:#0B1D14; --surface:rgba(20,44,31,.58); --solid:#0E2118; --line:rgba(160,220,180,.11);
  --ink:#EEF3EC; --muted:#8FA898; --gold-ink:#1A1206; --nav:rgba(6,18,12,.86); --scrim:rgba(0,0,0,.6);
  --joy:#F3BE4E; --grow:#5FD39A; --love:#FF8A75; --calm:#7CC4EC; --hard:#C9926A;
  --glow:rgba(243,190,78,.22); --soft:rgba(243,190,78,.12);
}}
:root[data-theme="dark"]{
  --bg:#06120C; --bg2:#0B1D14; --surface:rgba(20,44,31,.58); --solid:#0E2118; --line:rgba(160,220,180,.11);
  --ink:#EEF3EC; --muted:#8FA898; --gold-ink:#1A1206; --nav:rgba(6,18,12,.86); --scrim:rgba(0,0,0,.6);
  --joy:#F3BE4E; --grow:#5FD39A; --love:#FF8A75; --calm:#7CC4EC; --hard:#C9926A;
  --glow:rgba(243,190,78,.22); --soft:rgba(243,190,78,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;min-height:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--joy);outline-offset:3px}
.c-joy{color:var(--joy)}.c-grow{color:var(--grow)}.c-love{color:var(--love)}.c-calm{color:var(--calm)}.c-hard{color:var(--hard)}

.screen{display:none;width:100%;max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding:16px 16px 118px;
  background:radial-gradient(130% 55% at 50% 12%,var(--bg2) 0%,var(--bg) 72%)}
.screen.active{display:block}
.head{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 12px;gap:10px}
.head h1{font-family:Unbounded,sans-serif;font-size:22px;font-weight:700}
.head small{display:block;font-size:13px;color:var(--muted)}
.head .hello b{font-size:17px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--joy);background:var(--soft);border:1px solid var(--line);padding:7px 11px;border-radius:999px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 10px;gap:8px}
.sec h2{font-size:15px;font-weight:700}
.sec span,.sec button.link{font-size:12px;color:var(--muted);background:none;border:none}
.sec button.link{color:var(--joy);font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:12px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.muted{color:var(--muted)}
.btn{display:block;width:100%;border:none;border-radius:18px;padding:15px;font-weight:800;font-size:15px;background:var(--joy);color:var(--gold-ink);box-shadow:0 0 26px var(--glow)}
.btn[disabled]{opacity:.45;box-shadow:none}
.ghost{display:block;width:100%;border:1px solid var(--line);border-radius:18px;padding:14px;font-weight:700;font-size:15px;background:transparent}
.small-btn{border:none;border-radius:999px;padding:8px 13px;font-weight:800;font-size:13px;background:var(--joy);color:var(--gold-ink)}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;padding:26px 16px;color:var(--muted);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* чипы и выбор */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;background:transparent;border:1px solid var(--line);border-radius:14px;padding:9px 12px;text-align:left}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dot,var(--muted));flex:none}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--joy);color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{font-size:13px;font-weight:700;color:var(--muted);background:none;border:none;border-radius:10px;padding:9px 4px}
.seg button[aria-pressed="true"]{background:var(--joy);color:var(--gold-ink)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:13px 14px;margin-bottom:8px;font-size:15px;font-weight:600}
.opt small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.opt .dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--dot,var(--muted));box-shadow:0 0 8px var(--dot,transparent)}
.opt[aria-pressed="true"]{border-color:var(--joy);background:var(--soft)}
.opt .ck{margin-left:auto;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.opt[aria-pressed="true"] .ck{background:var(--joy);border-color:var(--joy);color:var(--gold-ink)}
.opt .ck svg{width:14px;height:14px;opacity:0}
.opt[aria-pressed="true"] .ck svg{opacity:1}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-size:15px;outline:none}
textarea.field{min-height:84px;resize:vertical;line-height:1.5}

/* задачи дня */
.task{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.tick{width:26px;height:26px;border-radius:9px;border:1.8px solid var(--muted);display:grid;place-items:center;flex:none;background:transparent;color:var(--gold-ink)}
.tick svg{width:15px;height:15px;opacity:0}
.task.done .tick{background:var(--joy);border-color:var(--joy)}
.task.done .tick svg{opacity:1}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:15px;font-weight:600}
.task.done .tx b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.task .tx small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:2px}
.task .tx small i{width:7px;height:7px;border-radius:50%;background:var(--dot)}
.task .x{background:none;border:none;color:var(--muted);font-size:18px;padding:4px 6px}
.main{display:flex;align-items:center;gap:14px;border-color:var(--joy)}
.main .ic{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,var(--joy),#E9A93A);color:var(--gold-ink)}
.main .ic svg{width:22px;height:22px}
.main .tx{flex:1;min-width:0}
.main small{font-size:12px;color:var(--muted)}
.main b{display:block;font-size:16px;font-weight:700;margin-top:2px;line-height:1.3}
.main .go{width:48px;height:48px;border-radius:50%;border:none;flex:none;background:var(--joy);color:var(--gold-ink);display:grid;place-items:center;box-shadow:0 0 24px var(--glow)}
.main .go svg{width:20px;height:20px}
.main.done{border-color:var(--grow)}
.main.done .go{background:var(--grow)}
.banner{border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.45;margin-bottom:12px;background:var(--soft);border:1px solid var(--line)}
.banner.calm{background:color-mix(in srgb,var(--calm) 14%,transparent)}
.banner button{margin-top:8px}

/* мир дня */
.world{position:relative;height:300px;margin:0 -16px}
.world canvas{width:100%;height:100%;display:block}
.world .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.world .n{font-family:Unbounded,sans-serif;font-weight:700;font-size:52px;line-height:1;text-shadow:0 0 30px var(--glow)}
.world .l{font-size:13px;color:var(--muted);margin-top:8px}
.world .lv{margin-top:8px;font-size:12px;font-weight:700;color:var(--joy)}
.moods{display:flex;gap:8px;justify-content:center;margin:0 0 14px}
.moods button{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.moods button[aria-pressed="true"]{color:var(--gold-ink);background:var(--joy);border-color:var(--joy)}

/* путь */
.goals{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.goals::-webkit-scrollbar{display:none}
.goalchip{flex:none;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px 8px 9px}
.goalchip i{width:10px;height:10px;border-radius:50%;background:var(--dot);box-shadow:0 0 8px var(--dot)}
.goalchip[aria-pressed="true"]{color:var(--ink);border-color:var(--dot);background:var(--soft)}
.mount{position:relative;height:390px;margin:0 -16px;overflow:hidden;border-radius:0 0 28px 28px}
.mount canvas{width:100%;height:100%;display:block}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:none;background:rgba(8,20,14,.74);color:#F4F1E6;border:1px solid rgba(243,190,78,.45);border-radius:12px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap;backdrop-filter:blur(8px)}
.pin small{display:block;font-size:11px;font-weight:500;color:rgba(244,241,230,.7)}
.pin:after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:rgba(8,20,14,.74);border-bottom:0}
.mount .ov{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;color:#F4F1E6}
.mount .ov b{font-family:Unbounded,sans-serif;font-size:30px;line-height:1;text-shadow:0 0 22px rgba(243,190,78,.35)}
.mount .ov small{display:block;font-size:12px;color:rgba(244,241,230,.72);margin-top:4px}
.camps{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 6px;padding:0 16px 4px;scrollbar-width:none}
.camps::-webkit-scrollbar{display:none}
.camp{flex:none;width:136px;border-radius:16px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:4px}
.camp small{font-size:11px;color:var(--muted)}
.camp b{font-weight:700;line-height:1.3}
.camp.done small{color:var(--joy)}
.camp.now{border-color:var(--joy);box-shadow:0 0 0 1px var(--joy) inset}
.camp.now small{color:var(--joy);font-weight:700}
.camp.next b{color:var(--muted)}
.camp button{margin-top:auto;border:none;border-radius:10px;padding:7px 8px;font-size:12px;font-weight:800;background:var(--joy);color:var(--gold-ink)}
.today{display:flex;gap:12px;align-items:center}
.today .tx{flex:1}
.today small{font-size:12px;color:var(--muted)}
.today b{display:block;font-size:16px;margin-top:2px;line-height:1.3}
.stepBtn{flex:none;width:64px;height:64px;border-radius:50%;border:none;background:var(--joy);color:var(--gold-ink);font-weight:800;font-size:12px;display:grid;place-items:center;box-shadow:0 0 28px var(--glow);line-height:1.1}
.stepBtn svg{width:22px;height:22px;display:block;margin:0 auto 2px}
.meter .rw{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.meter .rw span{color:var(--muted)}
.meter+.meter{margin-top:14px}
.track{height:8px;border-radius:4px;background:var(--line);margin-top:7px;overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;transition:width .9s cubic-bezier(.3,.8,.3,1)}
.ev{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:none;padding-bottom:0}
.ev:first-child{padding-top:0}
.ev .d{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;background:currentColor;box-shadow:0 0 8px currentColor}
.ev .tx{flex:1}
.ev b{font-size:14px;font-weight:700;color:var(--ink)}
.ev small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.ev time{font-size:12px;color:var(--muted);flex:none}
.lesson{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;padding:4px 8px;border-radius:9px;border:1px solid var(--line);color:var(--ink)}

/* вершины */
.peakcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:10px}
.peakcard.closed{border-color:var(--joy);background:linear-gradient(135deg,var(--soft),var(--surface))}
.peakcard svg.mini{width:62px;height:46px;flex:none}
.peakcard .tx{flex:1;min-width:0}
.peakcard b{font-size:15px;display:block}
.peakcard small{font-size:12px;color:var(--muted)}

/* история */
.book{position:relative;border-radius:26px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line);background:linear-gradient(160deg,#0F2A1D 0%,#0A1A12 55%,#1A1408 100%);color:#F4F1E6}
.book .in{position:relative;padding:18px 18px 16px 22px}
.book .spine{position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(#F3BE4E,#C98A1E)}
.book small{font-size:12px;color:rgba(244,241,230,.65)}
.book h2{font-family:Lora,serif;font-weight:500;font-size:25px;line-height:1.15;margin:6px 0 2px}
.book h2 em{color:#F3BE4E}
.book .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.book .nums div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:9px 4px;text-align:center}
.book .nums b{display:block;font-family:Unbounded,sans-serif;font-size:15px}
.book .nums span{font-size:10px;color:rgba(244,241,230,.65)}
.flow{position:relative;border-radius:22px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.flow canvas{display:block;width:100%;height:160px}
.flow .ft{display:flex;justify-content:space-between;padding:0 14px 12px;font-size:11px;color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 4px;padding:0 16px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.month h3{font-family:Lora,serif;font-weight:500;font-size:20px;margin:20px 2px 10px}
.e{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}
.e .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
.e .meta i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.e h4{font-size:15px;font-weight:700;line-height:1.35}
.e p{font-size:13px;color:var(--muted);line-height:1.5;margin-top:4px}
.e.peak{border-color:var(--joy);background:linear-gradient(135deg,var(--soft),var(--surface))}
.e q{display:block;font-family:Lora,serif;font-style:italic;font-size:17px;line-height:1.5;quotes:none}

/* профиль */
.portrait{position:relative;overflow:hidden;border-radius:26px;padding:18px;margin-bottom:12px;color:#F4F1E6;background:radial-gradient(120% 90% at 85% 0%,#2A3D62 0%,#0F1E2E 45%,#08140F 100%);border:1px solid var(--line)}
.portrait small{font-size:12px;color:rgba(244,241,230,.65)}
.portrait h3{font-family:Lora,serif;font-weight:500;font-size:23px;margin:6px 0 8px}
.portrait h3 em{color:#F3BE4E}
.portrait p{font-size:14px;line-height:1.55;color:rgba(244,241,230,.86)}
.portrait .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.portrait .tags span{font-size:12px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 10px}
.portrait .note{display:block;margin-top:10px;font-size:11px;color:rgba(244,241,230,.5)}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.2px 1.2px at 12% 20%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 12%,#fff9 50%,transparent 51%),radial-gradient(1.4px 1.4px at 88% 34%,#F3BE4E 50%,transparent 51%),radial-gradient(1px 1px at 40% 8%,#fff7 50%,transparent 51%),radial-gradient(1.2px 1.2px at 60% 26%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 22% 62%,#fff5 50%,transparent 51%),radial-gradient(1.3px 1.3px at 80% 70%,#fff6 50%,transparent 51%)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{border-radius:18px;padding:12px;background:var(--surface);border:1px solid var(--line)}
.st b{display:block;font-family:Unbounded,sans-serif;font-size:19px}
.st span{font-size:11px;color:var(--muted)}
.wheelBox{position:relative}
.wheelBox svg{display:block;width:100%;height:auto}
.wheelBox .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.wheelBox .mid b{display:block;font-family:Unbounded,sans-serif;font-size:24px}
.wheelBox .mid span{font-size:11px;color:var(--muted)}
.lbl{font-family:Manrope,sans-serif;font-size:10.5px;font-weight:700;fill:var(--muted);cursor:pointer}
.lbl.on{fill:var(--ink)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:18px;font-weight:700}
.stepper output{font-family:Unbounded,sans-serif;font-size:18px;min-width:28px;text-align:center}
.set{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);font-size:14px;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.set:last-child{border-bottom:none}
.set span{color:var(--muted);font-size:13px}
.sw{position:relative;width:46px;height:28px;border-radius:14px;background:var(--line);border:none;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--grow)}
.sw[aria-checked="true"]:after{transform:translateX(18px)}
.orb{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#FFE8B0,var(--joy) 45%,#6B4A10 100%);box-shadow:0 0 24px var(--glow)}

/* лист, чат, тост, вкладки */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:430px;max-height:88vh;overflow-y:auto;transform:translate(-50%,105%);visibility:hidden;transition:transform .36s cubic-bezier(.3,.8,.3,1),visibility 0s .36s;background:var(--solid);border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));z-index:41;border-top:1px solid var(--line)}
body.sheet-open .scrim{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:translate(-50%,0);visibility:visible;transition:transform .36s cubic-bezier(.3,.8,.3,1)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheetX{position:absolute;right:12px;top:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;color:var(--muted)}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:4px;line-height:1.25}
.sheet .lead{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.sheet label.q{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 8px}

  for(const[n,mm,dd,el]of z){if(m<mm||(m===mm&&d<=dd))return{name:n,el}}return{name:'Козерог',el:'earth'};

function portrait(p){
  let el='earth',sign=null;

  const e=ELEM[el];

  const i=stageIdx(g);if(i>=g.stages.length)return false;

function getDay(k){
  if(!S.days[k]){
    const prev=Object.keys(S.days).filter(x=>x<k).sort().pop();
    const carry=prev?S.days[prev].tasks.filter(t=>t.status==='moved'||(!t.status&&!S.days[prev].closed)).map(t=>({text:t.text,sphere:t.sphere,goalId:t.goalId||null,main:!!t.main})):[];
    S.days[k]={mood:null,tasks:[],thought:'',closed:false,carry};
  }
  return S.days[k];
}
function suggestMain(){
  const g=activeGoals().find(x=>x.id===S.active)||activeGoals()[0];
  if(!g)return null;
  const st=g.stages[stageIdx(g)];
  const pool=g.nextSteps&&g.nextSteps.length?g.nextSteps:[`Шаг к этапу «${st?st.name:'вершина'}»`];
  return{text:pool[(g.steps||0)%pool.length],sphere:g.sphere,goalId:g.id};
}
function addTask(day,t){day.tasks.push(Object.assign({id:uid(),status:null,main:false,goalId:null},t));S.custom[t.text]=(S.custom[t.text]||0)+1;save()}
function streak(){let n=0,k=today();for(;;){const d=S.days[k];if(d&&d.tasks.some(t=>t.status==='done'))n++;else if(k!==today())break;k=addDays(k,-1);if(n>999)break}return n}
function totalDone(){return Object.values(S.days).reduce((a,d)=>a+d.tasks.filter(t=>t.status==='done').length,0)}
function suggestGoals(p){
  const tags=new Set([`dream:${p.dream}`,`worry:${p.worry}`,`stage:${p.stage}`,...(p.restore||[]).map(r=>`restore:${r}`)]);
  const fam=p.family||[];
  return LIB.map(t=>{
    let s=0;t.tags.forEach(x=>{if(tags.has(x))s+=x.startsWith('dream')?5:x.startsWith('worry')?4:2});
    if(S.spheres.includes(t.sphere))s+=3;
    if(t.tags.includes('need:kids')&&!fam.includes('kids'))s-=20;
    if(t.tags.includes('need:partner')&&!fam.includes('partner'))s-=20;
    if(t.tags.includes('need:parents')&&!fam.includes('parents'))s-=20;
    return{t,s};
  }).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.t);
}

function fitCanvas(s){const r=s.canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);if(!r.width)return false;s.W=r.width;s.H=r.height;s.canvas.width=s.W*d;s.canvas.height=s.H*d;s.cx.setTransform(d,0,0,d,0,0);return true}

const EMOS=['grow','joy','love','calm','hard'];

/* ================= Мой мир: сфера из частиц ================= */
class World{
  constructor(canvas){this.canvas=canvas;this.cx=canvas.getContext('2d');this.energy=0;this.target=0;this.burst=0;this.angle=0;this.needSize=true;
    const N=1300,g=Math.PI*(3-Math.sqrt(5));this.N=N;this.pts=[];
    for(let i=0;i<N;i++){const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),t=g*i;this.pts.push({x:Math.cos(t)*r,y,z:Math.sin(t)*r,j:Math.random()*6.28,k:Math.random()})}
    for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[this.pts[i],this.pts[j]]=[this.pts[j],this.pts[i]]}
    SCENES.add(this)}
  size(){if(fitCanvas(this))this.needSize=false}
  set(e){this.target=clamp01(e)}
  pulse(){this.burst=1}
  draw(now){
    const{cx,W,H}=this;if(!W)return;const C=palette(),c1=C.grow,c2=C.joy;
    this.energy+=(this.target-this.energy)*.04;this.burst*=.94;if(!REDUCE)this.angle+=.0032+this.burst*.02;
    cx.clearRect(0,0,W,H);
    const gl=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.min(W,H)*.55);gl.addColorStop(0,cssv('--glow'));gl.addColorStop(1,'rgba(0,0,0,0)');cx.globalAlpha=.5+this.energy*.5;cx.fillStyle=gl;cx.fillRect(0,0,W,H);cx.globalAlpha=1;

    const vis=Math.floor(360+e*(this.N-360)),ca=Math.cos(this.angle),sa=Math.sin(this.angle),ct=Math.cos(.38),st=Math.sin(.38);
    for(let i=0;i<vis;i++){const p=this.pts[i],wob=REDUCE?0:Math.sin(now/900+p.j)*.035*(.4+e);
      const x=p.x*(1+wob),y=p.y*(1+wob),z=p.z*(1+wob),x1=x*ca+z*sa,z1=-x*sa+z*ca,y1=y*ct-z1*st,z2=y*st+z1*ct,dp=(z2+1)/2;
      const m=clamp01((1-p.y)/2*.6+e*.55+p.k*.15),c=mixc(c1,c2,m);
      cx.fillStyle=rgba(c,(.12+dp*.78)*(.55+e*.45));cx.beginPath();cx.arc(W/2+x1*R,H/2+y1*R,(.5+dp*1.5)*(.9+e*.5),0,6.283);cx.fill()}
  }
}

/* ================= Гора: путь и празднование ================= */
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
class Mountain{
  constructor(canvas,pinEl){this.canvas=canvas;this.cx=canvas.getContext('2d');this.pin=pinEl;this.needSize=true;
    this.units=0;this.shown=0;this.kinds=[];this.camps=5;this.stars=[];this.sparks=[];this.fw=[];this.P=[];this.phase=0;this.t0=0;this.flags={};this.nextRocket=0;this.mode='path';SCENES.add(this)}
  size(){if(!fitCanvas(this))return;this.needSize=false;this.build()}
  ridge(seed,y0,amp,peaks){const r=rng(seed),o=[...Array(6)].map(()=>[r()*6.283,1+r()*3]),pts=[];
    for(let i=0;i<=48;i++){const x=i/48;let y=y0;o.forEach(([ph,f],k)=>y+=Math.sin(x*f*6+ph)*amp/(k+1));for(const[px,py,w]of peaks)y-=Math.max(0,1-Math.abs(x-px)/w)*py;pts.push([x*this.W,y*this.H])}return pts}
  build(){
    const{W,H}=this;const top=this.mode==='celebrate'?.42:.40;this.peak=[W*.52,H*top];
    this.far=this.ridge(7,.61,.018,[[.2,.10,.25],[.85,.12,.22]]);this.mid=this.ridge(21,.72,.02,[[.1,.08,.2],[.95,.1,.2]]);
    const main=[];for(let i=0;i<=60;i++){const x=-.05+1.1*i/60,dx=x-.52;let y=top+Math.abs(dx)*(dx<0?1.08:.98);y+=Math.sin(x*37)*.006+Math.sin(x*91+1)*.004+(Math.abs(dx)>.03?Math.sin(x*17+2)*.012:0);main.push([x*W,Math.min(1.02,y)*H])}
    main[Math.round(.57/1.1*60)]=[this.peak[0],this.peak[1]];this.main=main;

    const T=[[.46,.91],[.28,.83],[.60,.75],[.36,.67],[.58,.59],[.44,.51],[.52,top]];
    this.path=[];for(let s=0;s<6;s++){const a=T[s],b=T[s+1];for(let k=0;k<10;k++){const t=k/10;this.path.push({x:(a[0]+(b[0]-a[0])*t)*W,y:(a[1]+(b[1]-a[1])*t)*H})}}
    this.path.push({x:this.peak[0],y:this.peak[1]});
    this.stars=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H*.5,s:Math.random()*1.2+.2,t:Math.random()*6}));

  }

  posAt(v){const i0=Math.max(0,Math.min(60,Math.floor(v))),k=v-i0,a=this.path[i0],b=this.path[Math.min(60,i0+1)];return[a.x+(b.x-a.x)*k,a.y+(b.y-a.y)*k]}
  scene(now,dawn){
    const{cx,W,H,peak}=this;
    const sky=cx.createLinearGradient(0,0,0,H*.74);sky.addColorStop(0,rgba(mixc([5,12,22],[22,34,58],dawn),1));sky.addColorStop(.58,rgba(mixc([10,26,30],[92,70,78],dawn),1));sky.addColorStop(1,rgba(mixc([16,38,32],[230,150,90],dawn),1));
    cx.fillStyle=sky;cx.fillRect(0,0,W,H);
    for(const s of this.stars){const tw=REDUCE?.6:.35+.65*Math.abs(Math.sin(now/1300+s.t));cx.fillStyle=`rgba(236,242,236,${(1-dawn*.8)*.65*tw})`;cx.beginPath();cx.arc(s.x,s.y,s.s,0,6.283);cx.fill()}
    const sg=cx.createRadialGradient(peak[0],peak[1]+H*.08,0,peak[0],peak[1]+H*.08,W*.75);sg.addColorStop(0,`rgba(255,205,120,${.08+.5*dawn})`);sg.addColorStop(.35,`rgba(243,160,90,${.03+.2*dawn})`);sg.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=sg;cx.fillRect(0,0,W,H);
    this.poly(this.far,rgba(mixc([22,36,56],[70,62,86],dawn),1));this.poly(this.mid,rgba(mixc([14,32,30],[40,50,52],dawn),1));

    const lg=cx.createRadialGradient(peak[0]-W*.08,peak[1]+H*.05,0,peak[0]-W*.08,peak[1]+H*.05,W*.55);lg.addColorStop(0,`rgba(255,200,130,${.08+dawn*.25})`);lg.addColorStop(1,'rgba(255,200,130,0)');cx.fillStyle=lg;cx.fillRect(0,0,W,H);cx.restore();
    cx.beginPath();cx.moveTo(peak[0],peak[1]);cx.lineTo(peak[0]-W*.055,peak[1]+H*.055);cx.lineTo(peak[0]-W*.02,peak[1]+H*.045);cx.lineTo(peak[0]+W*.005,peak[1]+H*.06);cx.lineTo(peak[0]+W*.03,peak[1]+H*.04);cx.lineTo(peak[0]+W*.05,peak[1]+H*.05);cx.closePath();cx.fillStyle='rgba(232,238,236,.9)';cx.fill();
  }
  trail(now,C,progress){

    for(let i=0;i<60;i++){const a=this.path[i],b=this.path[i+1],on=i<lit,k=this.kinds[i]||'grow';cx.strokeStyle=on?rgba(C[k],.62):'rgba(236,242,236,.12)';cx.lineWidth=on?2.2:1;cx.setLineDash(on?[]:[3,4]);cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}

  }

class Flow{
  constructor(canvas){this.canvas=canvas;this.cx=canvas.getContext('2d');this.data=[];this.needSize=true;this.dots=Array.from({length:60},()=>({p:Math.random(),l:Math.floor(Math.random()*5),o:Math.random(),v:.0006+Math.random()*.0012}));SCENES.add(this)}
  size(){if(fitCanvas(this))this.needSize=false}
  set(data,peaks){this.data=data;this.peaks=peaks||[]}
  x(i){const n=Math.max(2,this.data.length);return 14+(this.W-28)*i/(n-1)}
  layers(){const mx=Math.max(1,...this.data.map(d=>d.reduce((a,b)=>a+b,0))),sc=(this.H-40)/mx,mid=this.H*.5;return this.data.map(d=>{const tot=d.reduce((a,b)=>a+b,0);let y=mid-tot*sc/2;return d.map(v=>{const t=y;y+=v*sc;return[t,y]})})}
  draw(now){
    const{cx,W,H}=this;if(!W||this.data.length<2)return;const C=palette();cx.clearRect(0,0,W,H);const L=this.layers();
    for(let k=0;k<5;k++){const top=L.map((m,i)=>[this.x(i),m[k][0]]),bot=L.map((m,i)=>[this.x(i),m[k][1]]).reverse();
      cx.beginPath();cx.moveTo(top[0][0],top[0][1]);for(let i=1;i<top.length;i++){const[x0,y0]=top[i-1],[x1,y1]=top[i],mx=(x0+x1)/2;cx.bezierCurveTo(mx,y0,mx,y1,x1,y1)}
      cx.lineTo(bot[0][0],bot[0][1]);for(let i=1;i<bot.length;i++){const[x0,y0]=bot[i-1],[x1,y1]=bot[i],mx=(x0+x1)/2;cx.bezierCurveTo(mx,y0,mx,y1,x1,y1)}cx.closePath();
      const g=cx.createLinearGradient(0,0,W,0);g.addColorStop(0,rgba(C[EMOS[k]],.3));g.addColorStop(1,rgba(C[EMOS[k]],.88));cx.fillStyle=g;cx.fill()}
    const n=this.data.length;
    for(const d of this.dots){if(!REDUCE)d.p=(d.p+d.v)%1;const fi=d.p*(n-1),a=Math.floor(fi),b=Math.min(n-1,a+1),t=fi-a,e=t*t*(3-2*t),top=L[a][d.l][0]+(L[b][d.l][0]-L[a][d.l][0])*e,bot=L[a][d.l][1]+(L[b][d.l][1]-L[a][d.l][1])*e;
      if(bot-top<1)continue;cx.fillStyle=`rgba(255,255,255,${.25+.45*Math.sin(d.p*Math.PI)})`;cx.beginPath();cx.arc(this.x(fi),top+(bot-top)*(.2+.6*d.o),1.2,0,6.283);cx.fill()}

  }
}

    h+=`<div class="banner calm">Сегодня хватит одного главного шага. Остальное — без чувства вины. Помни: это временно. Что тебя восстанавливает: <b>${tip}</b>.</div>`}

    else h+=`<div class="card"><div class="empty"><b>Выбери первую вершину</b>Тогда каждый день будет главный шаг к ней.<br><br><button class="small-btn" data-act="addGoal">Выбрать вершину</button></div></div>`}
  const rest=tasks.filter(t=>!t.main);
  h+=`<div class="sec"><h2>Сегодня</h2><span>${rest.length?`${rest.filter(t=>t.status==='done').length} из ${rest.length}`:'нажми, что планируешь'}</span></div>`;
  if(rest.length)h+=`<div class="card" style="padding:4px 16px">${rest.map(t=>{const s=SPH[t.sphere]||SPH.work;const st=t.status==='moved'?' · завтра':t.status==='fail'?' · опыт':'';return `<div class="task ${t.status==='done'?'done':''}"><button class="tick" data-act="toggle" data-id="${t.id}" aria-label="Отметить: ${esc(t.text)}">${ICON.check}</button><div class="tx"><b>${esc(t.text)}</b><small style="--dot:var(--${s.emo})"><i></i>${s.name}${st}</small></div>${t.status?'':`<button class="x" data-act="delTask" data-id="${t.id}" aria-label="Убрать">×</button>`}</div>`}).join('')}</div>`;

    h+=`<div class="sec" style="margin-top:22px"><h2>Вечер</h2><span>1 минута</span></div><div class="grid2"><button class="btn" data-act="evening">Итог дня</button><button class="ghost" data-act="moment">Тёплый момент</button></div>`;

  }
  $('#dayBody').innerHTML=h;
}

  const sg=(()=>{const st=g.stages[si];const pool=g.nextSteps&&g.nextSteps.length?g.nextSteps:[`Шаг к этапу «${st?st.name:''}»`];return pool[g.steps%pool.length]})();
  let h=`<div class="camps">${g.stages.map((s,i)=>{const done=!!s.done,now=i===si;return `<div class="camp ${done?'done':now?'now':'next'}"><small>${done?'✓ '+ruDate(s.done):i===n-1?'Вершина':'Лагерь '+(i+1)}${now?' · сейчас':''}</small><b>${esc(s.name)}</b>${now?`<button data-act="stageDone" data-id="${g.id}">${i===n-1?'Вершина взята':'Этап пройден'}</button>`:''}</div>`}).join('')}</div>`;
  h+=`<div class="sec"><h2>Шаг к вершине</h2><span>маленький — нормально</span></div><div class="card today"><div class="tx"><small>${SPH[g.sphere].name}</small><b>${esc(sg)}</b><small style="color:var(--grow);font-weight:600;display:block;margin-top:6px">Каждый шаг зажигает тропу</small></div><button class="stepBtn" data-act="goalStep" data-id="${g.id}" data-t="${esc(sg)}" aria-label="Отметить шаг"><span>${ICON.check}Шаг</span></button></div>`;

  $('#pathBody').innerHTML=h;
}

/* ================= история ================= */
function flowData(){
  const start=S.created||today(),span=daysBetween(start,today())+1,byWeek=span>21,buckets=[];
  const n=byWeek?Math.min(16,Math.ceil(span/7)):Math.max(7,Math.min(21,span)),unit=byWeek?7:1;
  for(let i=0;i<n;i++)buckets.push([0,0,0,0,0]);
  const idx=k=>{const back=daysBetween(k,today());const b=n-1-Math.floor(back/unit);return b>=0&&b<n?b:-1};
  Object.entries(S.days).forEach(([k,d])=>{const b=idx(k);if(b<0)return;d.tasks.forEach(t=>{if(t.status==='done')buckets[b][EMOS.indexOf(SPH[t.sphere]?SPH[t.sphere].emo:'grow')]++})});
  const peaks=[];S.feed.forEach(f=>{const b=idx(f.date);if(b<0)return;buckets[b][EMOS.indexOf(f.kind||'grow')]+=f.type==='lesson'?1.5:1;if(f.type==='peak')peaks.push(b)});
  return{data:buckets.map(x=>x.map(v=>v+.15)),peaks,label:byWeek?`${n} недель`:`${n} ${word(n,W_DAY)}`};
}
function renderHistory(){
  const cl=closedGoals().length,moments=S.feed.filter(f=>f.type==='moment').length,days=S.created?daysBetween(S.created,today())+1:0,yr=today().slice(0,4);
  $('#bookCover').innerHTML=`<div class="spine"></div><div class="in"><small>Книга жизни · ${esc(S.profile.name)} · глава ${yr}</small><h2>${cl?`Год, когда я <em>взял ${cl} ${word(cl,['вершину','вершины','вершин'])}</em>`:`Начало <em>моей реальности</em>`}</h2><div style="font-size:13px;color:rgba(244,241,230,.7)">Каждый шаг, радость и трудность — здесь</div><div class="nums"><div><b>${days}</b><span>${word(days,W_DAY)} в пути</span></div><div><b>${fmtN(totalDone())}</b><span>шагов</span></div><div><b>${cl}</b><span>вершин</span></div><div><b>${moments}</b><span>моментов</span></div></div></div>`;
  const fd=flowData();flow.set(fd.data,fd.peaks);$('#flowFt').innerHTML=`<span>${fd.label} назад</span><span>сегодня</span>`;
  const f=ui.filter;
  $('#filters').innerHTML=[['all','Всё'],['joy','Победы'],['love','Близкие'],['calm','Тишина'],['hard','Опыт'],['grow','Мысли и путь']].map(([v,l])=>`<button class="chip" data-act="filter" data-v="${v}" aria-pressed="${f===v}" ${v!=='all'?`style="--dot:var(--${v})"`:''}>${v!=='all'?'<i></i>':''}${l}</button>`).join('');
  const items=S.feed.filter(x=>f==='all'||x.kind===f).slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!items.length){$('#feed').innerHTML=`<div class="card"><div class="empty"><b>История только начинается</b>Закрывай дни, сохраняй тёплые моменты — они появятся здесь.</div></div>`;return}
  const groups={};items.forEach(x=>{(groups[monthKey(x.date)]=groups[monthKey(x.date)]||[]).push(x)});
  const NAMES={peak:'Вершина',stage:'Лагерь',money:'Взнос',moment:'Тёплый момент',thought:'Мысль',lesson:'Опыт через трудность',start:'Начало пути'};
  $('#feed').innerHTML=Object.keys(groups).sort().reverse().map(m=>`<section class="month"><h3>${monthName(m+'-01')}</h3>${groups[m].map(x=>{
    const meta=`<div class="meta c-${x.kind}"><i></i><b>${NAMES[x.type]||''}</b> · ${ruDate(x.date)}</div>`;
    if(x.type==='peak')return `<article class="e peak">${meta}<h4>${esc(x.title)}</h4><p>${esc(x.text)}</p>${x.words?`<q style="font-size:15px;margin-top:8px">«${esc(x.words)}»</q>`:''}<button class="small-btn" style="margin-top:10px" data-act="replayPeak" data-id="${x.goalId}">Пережить момент</button></article>`;
    if(x.type==='thought')return `<article class="e">${meta}<q>${esc(x.text)}</q></article>`;
    if(x.type==='lesson')return `<article class="e">${meta}<h4>${esc(x.title)}</h4><span class="lesson">${esc(x.text)}</span></article>`;
    return `<article class="e">${meta}<h4>${esc(x.title)}</h4>${x.text?`<p>${esc(x.text)}</p>`:''}</article>`}).join('')}</section>`).join('');
}

A.exOpt=el=>{ui.exportOpt[el.dataset.k]=el.dataset.v;if(el.dataset.k==='who'){const fam=el.dataset.v==='family';ui.exportOpt.money=!fam;ui.exportOpt.priv=!fam}A.exportBook()};
A.exSw=el=>{const k=el.dataset.k;ui.exportOpt[k]=!ui.exportOpt[k];el.setAttribute('aria-checked',String(ui.exportOpt[k]))};
function bookHtml(){
  const o=ui.exportOpt,from=o.period==='Месяц'?addDays(today(),-31):o.period==='Год'?addDays(today(),-366):'0000';
  let items=S.feed.filter(x=>x.date>=from).filter(x=>(o.money||x.type!=='money')&&(o.priv||!['lesson','thought'].includes(x.type)));
  const groups={};items.sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{(groups[monthKey(x.date)]=groups[monthKey(x.date)]||[]).push(x)});
  const col={joy:'#C98A1E',grow:'#2F7A55',love:'#D0644F',calm:'#3B7FA8',hard:'#9A6A43'};
  const ch=Object.keys(groups).map(m=>`<section><h2>${monthName(m+'-01')}</h2>${groups[m].map(x=>`<div class="it" style="border-color:${col[x.kind]||'#999'}"><small>${ruDate(x.date)}</small><h3>${esc(x.title)}</h3>${x.text?`<p>${esc(o.money?x.text:x.text.replace(/\d[\d\s]*₽?/g,'…'))}</p>`:''}${x.words?`<blockquote>«${esc(x.words)}»</blockquote>`:''}</div>`).join('')}</section>`).join('');
  return `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Книга жизни — ${esc(S.profile.name)}</title><style>body{font-family:Georgia,serif;max-width:720px;margin:0 auto;padding:40px 24px;color:#1c241f;background:#faf7f0;line-height:1.55}.cover{text-align:center;padding:80px 20px;border-bottom:2px solid #C98A1E;margin-bottom:40px}.cover h1{font-size:40px;margin:0}.cover p{color:#6b6b6b}.nums{display:flex;justify-content:center;gap:28px;margin-top:24px;font-family:system-ui}.nums b{display:block;font-size:26px;color:#C98A1E}h2{font-size:26px;margin:40px 0 14px;border-bottom:1px solid #ddd;padding-bottom:6px}.it{border-left:4px solid;padding:6px 0 6px 14px;margin:0 0 16px;page-break-inside:avoid}.it small{color:#888;font-family:system-ui}.it h3{margin:2px 0;font-size:18px}.it p{margin:2px 0;color:#444}blockquote{font-style:italic;margin:6px 0 0;color:#8a5f14}</style></head><body><div class="cover"><p>Книга жизни</p><h1>${esc(S.profile.name)}</h1><p>${o.period==='Всё'?'Весь путь':o.period==='Год'?'Последний год':'Последний месяц'} · собрано ${ruDate(today())} ${today().slice(0,4)}</p><div class="nums"><div><b>${closedGoals().length}</b>вершин</div><div><b>${fmtN(totalDone())}</b>шагов</div><div><b>${S.feed.filter(f=>f.type==='moment').length}</b>тёплых моментов</div></div></div>${ch||'<p>Пока пусто — история начинается.</p>'}</body></html>`;
}
A.buildBook=async()=>{const html=bookHtml(),name=`Книга-жизни-${S.profile.name}.html`;haptic('success');
  $('#bookPrev').innerHTML=`<div class="banner" style="margin-top:12px">Книга собрана: ${S.feed.length} ${word(S.feed.length,['запись','записи','записей'])}.</div>`;

function wheelNow(){const mk=monthKey(today());if(!S.wheel[mk]){const prev=Object.keys(S.wheel).sort().pop();S.wheel[mk]=prev?Object.assign({},S.wheel[prev]):Object.fromEntries(SPHERES.map(s=>[s.id,5]));save()}return S.wheel[mk]}
function wheelPrev(){const mk=monthKey(today());const k=Object.keys(S.wheel).filter(x=>x<mk).sort().pop();return k?S.wheel[k]:null}
function rankName(n){return n>=6?'Мастер пути':n>=3?'Строитель':n>=1?'Путник':'Искатель'}
function renderProfile(){
  const p=portrait(S.profile),cl=closedGoals().length,days=S.created?daysBetween(S.created,today())+1:0,used=S.mentor[monthKey(today())]||0,left=S.plus?'без лимита':`осталось ${Math.max(0,LIMITS.mentor-used)} из ${LIMITS.mentor}`;
  const hard=S.feed.filter(f=>f.type==='lesson').length,tm={morning:'утро',day:'день',evening:'вечер'}[S.profile.time]||'утро';
  let h=`<div class="row" style="margin:4px 2px 14px;gap:14px"><div style="width:62px;height:62px;border-radius:50%;padding:3px;background:conic-gradient(var(--grow) 0 40%,var(--joy) 40% 62%,var(--love) 62% 78%,var(--calm) 78% 92%,var(--hard) 92% 100%);flex:none"><div style="width:100%;height:100%;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:Unbounded;font-weight:700;font-size:22px">${esc((S.profile.name||'Я')[0].toUpperCase())}</div></div><div><h1 style="font-family:Unbounded;font-size:20px">${esc(S.profile.name)}</h1><div class="muted" style="font-size:13px;margin-top:3px">С нами ${days} ${word(days,W_DAY)} · твоё время — ${tm}</div><span class="pill" style="margin-top:6px;padding:4px 10px;font-size:12px">${ICON.peak.replace('<svg','<svg width="12" height="12"')}${rankName(cl)} · ${cl} ${word(cl,['вершина','вершины','вершин'])}</span></div></div>`;
  h+=`<div class="portrait"><div class="stars"></div><div style="position:relative"><small>Твой портрет${p.sign?' · '+p.sign:''}</small><h3>${p.title}</h3><p>${esc(p.text)}</p><div class="tags">${p.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div><span class="note">Портрет — для вдохновения, решения он не подсказывает</span></div></div>`;
  h+=`<div class="stats3"><div class="st"><b class="c-joy">${streak()}</b><span>${word(streak(),W_DAY)} подряд</span></div><div class="st"><b class="c-grow">${fmtN(totalDone())}</b><span>шагов всего</span></div><div class="st"><b class="c-hard">${hard}</b><span>трудностей пройдено</span></div></div>`;
  // колесо
  const cur=wheelNow(),prev=wheelPrev(),sel=SPHERES[ui.wsel],CX=170,CY=170,R0=38,R1=128,N=10,ang=i=>-Math.PI/2+i*2*Math.PI/N,rOf=v=>R0+(R1-R0)*v/10;
  const arc=(r0,r1,a0,a1)=>{const q=(r,a)=>[CX+Math.cos(a)*r,CY+Math.sin(a)*r];const[x0,y0]=q(r1,a0),[x1,y1]=q(r1,a1),[x2,y2]=q(r0,a1),[x3,y3]=q(r0,a0);return `M${x0} ${y0}A${r1} ${r1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`};
  let sv='';for(let k=1;k<=5;k++)sv+=`<circle cx="${CX}" cy="${CY}" r="${R0+(R1-R0)*k/5}" fill="none" stroke="var(--line)"/>`;
  SPHERES.forEach((s,i)=>{const a0=ang(i)+.035,a1=ang(i+1)-.035,am=(a0+a1)/2;sv+=`<path d="${arc(R0,R1,a0,a1)}" fill="var(--${s.emo})" opacity=".08"/><path data-act="wsel" data-i="${i}" style="cursor:pointer" d="${arc(R0,rOf(cur[s.id]),a0,a1)}" fill="var(--${s.emo})" opacity="${i===ui.wsel?1:.7}"/><text class="lbl ${i===ui.wsel?'on':''}" data-act="wsel" data-i="${i}" x="${CX+Math.cos(am)*(R1+18)}" y="${CY+Math.sin(am)*(R1+18)}" text-anchor="middle" dominant-baseline="middle">${s.name}</text>`});
  if(prev){const pts=SPHERES.map((s,i)=>{const am=(ang(i)+ang(i+1))/2,r=rOf(prev[s.id]);return `${CX+Math.cos(am)*r},${CY+Math.sin(am)*r}`}).join(' ');sv+=`<polygon points="${pts}" fill="none" stroke="var(--ink)" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="4 4"/>`}
  sv+=`<circle cx="${CX}" cy="${CY}" r="${R0-6}" fill="var(--bg)" stroke="var(--line)"/>`;
  const avg=SPHERES.reduce((a,s)=>a+cur[s.id],0)/N,delta=prev?cur[sel.id]-prev[sel.id]:null;
  const low=SPHERES.filter(s=>!(s.id==='kids'&&!(S.profile.family||[]).includes('kids'))&&!(s.id==='partner'&&!(S.profile.family||[]).includes('partner'))).sort((a,b)=>cur[a.id]-cur[b.id])[0];
  h+=`<div class="sec"><h2>Колесо жизни</h2><span>${MON_NOM[kdate(today()).getMonth()].toLowerCase()} · нажми на сферу</span></div><div class="card"><div class="wheelBox"><svg viewBox="0 0 340 340" role="img" aria-label="Колесо жизни">${sv}</svg><div class="mid"><b>${avg.toFixed(1).replace('.',',')}</b><span>баланс</span></div></div>
  <div class="row" style="margin-top:10px;padding-top:12px;border-top:1px solid var(--line)"><div style="flex:1"><div class="muted" style="font-size:12px">${sel.group}</div><b style="font-size:16px">${sel.name}</b>${delta!==null?`<div style="font-size:12px;font-weight:700;color:${delta>0?'var(--grow)':delta<0?'var(--hard)':'var(--muted)'}">${delta>0?'+'+delta:delta<0?'−'+(-delta):'без изменений'} за месяц</div>`:''}</div><div class="stepper"><button data-act="wstep" data-v="-1" aria-label="Меньше">−</button><output>${cur[sel.id]}</output><button data-act="wstep" data-v="1" aria-label="Больше">+</button></div></div>
  <div class="banner" style="margin:12px 0 0">Меньше всего внимания сейчас получает <b class="c-joy">${low.name}</b> — без упрёков, просто картина месяца.<br><button class="small-btn" data-act="addGoal" data-sphere="${low.id}">Вершина для сферы «${low.name}»</button></div></div>`;
  // наставник
  h+=`<div class="sec"><h2>Наставник</h2><span>${left}</span></div><div class="card"><div class="row"><div class="orb"></div><div style="flex:1"><b>Спроси, как у друга</b><div class="muted" style="font-size:12px;margin-top:2px">${SAMPLE?'Знает твои вершины и путь, отвечает спокойно и по делу':'В этой версии — примерные ответы. В Telegram здесь будет ИИ'}</div></div></div>
  <div class="chips" style="margin-top:12px">${MENTOR_Q.slice(0,3).map(q=>`<button class="chip" data-act="ask" data-q="${esc(q)}">${esc(q)}</button>`).join('')}<button class="chip add" data-act="chat">Свой вопрос</button></div></div>`;
  // подписка
  h+=`<div class="card" style="border-color:var(--joy);background:linear-gradient(150deg,var(--soft),var(--surface) 60%)"><div class="row" style="justify-content:space-between"><b style="font-family:Unbounded;font-size:17px">Моя реальность<span class="c-joy">+</span></b><button class="sw" role="switch" aria-checked="${S.plus}" data-act="plusToggle" aria-label="Плюс для теста"></button></div>
  <div class="muted" style="font-size:13px;margin:6px 0 10px">${S.plus?'Плюс включён для теста':'390 ₽ в месяц · 7 дней бесплатно · переключатель — для теста'}</div>
  <div style="display:grid;grid-template-columns:1fr auto auto;gap:7px 14px;font-size:13px"><span></span><span class="muted" style="font-size:11px;font-weight:700">База</span><span class="muted" style="font-size:11px;font-weight:700">Плюс</span>${[['Утро, вечер, шаги','✓','✓'],['Сферы жизни','3','10'],['Вершин одновременно','1','∞'],['Вопросы наставнику','5/мес','∞'],['Книга жизни в файл','—','✓']].map(r=>`<span>${r[0]}</span><span class="muted" style="text-align:center">${r[1]}</span><span class="c-grow" style="text-align:center;font-weight:800">${r[2]}</span>`).join('')}</div></div>`;
  // настройки
  h+=`<div class="card" style="padding:4px 16px"><div class="set">Звук и вибрация<button class="sw" role="switch" aria-checked="${S.sound}" data-act="soundToggle" aria-label="Звук"></button></div><button class="set" data-act="spheres">Мои сферы<span>${S.spheres.map(id=>SPH[id].name).join(', ')}</span></button><button class="set" data-act="nextDay">Перейти на следующий день<span>для теста</span></button><button class="set" data-act="seedDemo">Заполнить примером<span>для теста</span></button><button class="set" data-act="resetAsk" style="color:var(--love)">Начать заново<span>стереть данные</span></button></div>${memOnly?'<p class="muted" style="font-size:12px;text-align:center">Данные хранятся только до закрытия страницы</p>':''}`;
  $('#profileBody').innerHTML=h;
}

  $$('#sheetBody [data-group] [data-v]').forEach(b=>b.onclick=()=>selGroup(b))};

const MENTOR_Q=['Как не бросить после отказа?','Что делать в тяжёлый день?','Как дойти до своей вершины?','Как совмещать дело и семью?'];
const MENTOR_DEMO={
  'Как не бросить после отказа?':'Отказ — это не приговор, а информация. Вечером запиши: что произошло, что это дало и что делаешь иначе. Ты уже проходил трудности и продолжал — это и есть твоя сила. Шаг на завтра: одно маленькое действие по той же задаче, но другим способом.',
  'Что делать в тяжёлый день?':'Опусти планку: оставь один главный шаг, остальное перенеси без чувства вины. Сделай то, что тебя восстанавливает, и не делай выводов о всей жизни по одному дню. Если тяжело долго, поговори с близким или специалистом — это нормально и сильно. Шаг на сегодня: 10 минут тишины или прогулка.',
  'Как дойти до своей вершины?':'Проверь, зачем тебе это и на чём основано решение. Дальше — лагеря: 4–6 этапов, и на каждый маленькие шаги, которые по силам уже сегодня. Если шаг не делается три дня подряд, он слишком большой — дроби. Шаг на завтра: назначь один главный шаг утром.',
  'Как совмещать дело и семью?':'Раздели день: основное дело — в лучшие часы, дальше время для близких. Ставь встречу с родными в план так же серьёзно, как встречу с клиентом. Работа ради семьи даёт силы, только если семья видит тебя, а не только результат. Шаг на неделю: один вечер без телефона с близкими.'
};
function mentorContext(){
  const d=S.days[today()];
  const data={имя:S.profile.name,этап:S.profile.stage,рядом:S.profile.family,беспокоит:S.profile.worry,мечта:S.profile.dream,ритм:S.profile.pace,после_неудачи:S.profile.fail,восстанавливает:S.profile.restore,
    сферы:S.spheres.map(id=>SPH[id].name),
    вершины:activeGoals().map(g=>({название:g.name,зачем:g.why,этап:`${stageIdx(g)+1} из ${g.stages.length}: ${(g.stages[stageIdx(g)]||{}).name||'вершина'}`,шагов:g.steps,деньги:g.money?`${g.money.saved} из ${g.money.target}`:null})),
    взято_вершин:closedGoals().map(g=>g.name),сегодня:d?{настроение:d.mood,дела:d.tasks.map(t=>`${t.text} — ${t.status||'в плане'}`)}:null,
    последний_опыт:S.feed.filter(f=>f.type==='lesson').slice(-3).map(f=>`${f.title}. ${f.text}`),серия_дней:streak()};
  return `Ты — наставник в приложении «Моя реальность». Приложение помогает человеку наводить порядок в жизни маленькими ежедневными шагами к своим вершинам (целям) во всех сферах: здоровье, близкие, дело, деньги, дом, отдых. Принципы: любая попытка — победа; отказ — это опыт, а не провал; маленький шаг лучше рывка; решения не на эмоциях, а с проверкой «на чём это основано».
Отвечай по-русски, на «ты», тепло и спокойно, как мудрый друг. Коротко: 3–6 предложений, без markdown и заголовков. Заканчивай одним конкретным маленьким шагом на сегодня или завтра. Опирайся на данные человека, но не пересказывай их. Не ставь диагнозов и не давай финансовых гарантий; при серьёзных вопросах здоровья, денег или права мягко советуй специалиста. Если человек пишет о желании навредить себе или о полной безнадёжности — в первую очередь поддержи и предложи обратиться к близким или на линию помощи.
Данные человека: ${JSON.stringify(data).slice(0,5000)}`;
}

  sheet(`<div class="row" style="padding-bottom:10px;border-bottom:1px solid var(--line)"><div class="orb" style="width:34px;height:34px"></div><b style="flex:1">Наставник</b><span class="c-joy" style="font-size:12px;font-weight:800" id="chatLeft">${left===0?'лимит месяца':left+' '+(left==='∞'?'':'осталось')}</span></div>
  <div class="msgs" id="msgs" aria-live="polite">${S.chat.length?S.chat.map(m=>`<div class="m ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join(''):`<div class="m a">Привет, ${esc(S.profile.name)}. О чём подумаем?</div>`}</div>
  <div class="chips" style="margin:6px 0 10px">${MENTOR_Q.map(q=>`<button class="chip" data-act="askIn" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
  <div class="row"><input class="field" id="chatIn" placeholder="Напиши вопрос" maxlength="600"><button class="small-btn" style="padding:13px 16px" data-act="sendChat">→</button></div>`);
  const m=$('#msgs');m.scrollTop=m.scrollHeight;$('#chatIn').onkeydown=e=>{if(e.key==='Enter')A.sendChat()};
}
A.askIn=el=>sendMentor(el.dataset.q);
A.sendChat=()=>{const v=$('#chatIn').value.trim();if(v){$('#chatIn').value='';sendMentor(v)}};
async function sendMentor(q){
  if(ui.chatBusy)return;const mk=monthKey(today()),used=S.mentor[mk]||0,msgs=$('#msgs');
  const add=(cls,t)=>{const d=document.createElement('div');d.className='m '+cls;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d};
  if(!S.plus&&used>=LIMITS.mentor){add('a','Вопросы в этом месяце закончились. В «Моя реальность+» наставник отвечает без ограничений.');return}
  add('u',q);S.chat.push({role:'user',content:q});
  const b=add('a wait','Думаю…');ui.chatBusy=true;
  let answer='';
  if(SAMPLE){
    try{const turns=[{role:'user',content:mentorContext()},...S.chat.slice(-9).map(m=>({role:m.role,content:m.content}))];
      const r=await SAMPLE(turns,{cache:false,onText:({text})=>{b.classList.remove('wait');b.textContent=text;msgs.scrollTop=msgs.scrollHeight}});answer=r.text}
    catch(e){answer=(e&&e.text)||'';if(!answer){answer=MENTOR_DEMO[q]||'Сейчас не получилось ответить. Попробуй чуть позже.';if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled'].includes(e.code))SAMPLE=null}}
  }else{await new Promise(r=>setTimeout(r,REDUCE?0:700));answer=MENTOR_DEMO[q]||'Хороший вопрос. Разбей его на один маленький шаг, который можно сделать уже сегодня, и отметь его в дне. В Telegram-версии здесь ответит ИИ-наставник, который знает твой путь.'}
  b.classList.remove('wait');b.textContent=answer;S.chat.push({role:'assistant',content:answer});S.chat=S.chat.slice(-20);
  S.mentor[mk]=used+1;save();ui.chatBusy=false;haptic('light');
  const l=$('#chatLeft');if(l){const left=S.plus?'∞':Math.max(0,LIMITS.mentor-used-1);l.textContent=left===0?'лимит месяца':left+(left==='∞'?'':' осталось')}
}
