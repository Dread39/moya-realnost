  if(DOWNLOADS){try{await DOWNLOADS.save({filename:`Книга-жизни-${S.profile.name}.html`,data:html});toast('Книга сохранена')}catch(e){if(e&&e.code!=='declined')toast('Не удалось сохранить файл')}}
  else toast('В Telegram книга придёт файлом от бота')};

/* ================= я ================= */
function rankName(n){return n>=6?'Мастер пути':n>=3?'Строитель':n>=1?'Путник':'Искатель'}
function wheelNow(){const mk=monthKey(today());if(!S.wheel[mk]){const prev=Object.keys(S.wheel).sort().pop();S.wheel[mk]=prev?Object.assign({},S.wheel[prev]):Object.fromEntries(S.spheres.map(id=>[id,5]));save()}return S.wheel[mk]}
function wheelPrev(){const mk=monthKey(today()),k=Object.keys(S.wheel).filter(x=>x<mk).sort().pop();return k?S.wheel[k]:null}
function renderMe(){
  const p=portrait(S.profile),cl=closedGoals().length,days=S.created?daysBetween(S.created,today())+1:0;
  const moments=S.feed.filter(f=>f.type==='moment').length,hard=lessonsList().length;
  let h=`<div class="row" style="margin:2px 2px 16px;gap:14px"><div style="width:56px;height:56px;border-radius:50%;padding:3px;background:conic-gradient(var(--grow) 0 34%,var(--joy) 34% 60%,var(--love) 60% 80%,var(--calm) 80% 92%,var(--hard) 92% 100%);flex:none"><div style="width:100%;height:100%;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:Unbounded;font-weight:700;font-size:20px">${esc((S.profile.name||'Я')[0].toUpperCase())}</div></div>
   <div style="flex:1"><b style="font-family:Unbounded;font-size:19px">${esc(S.profile.name)}</b><div class="muted" style="font-size:13px;margin-top:2px">${rankName(cl)}</div></div>
   <button class="small-btn" style="background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px 11px" data-act="settings" aria-label="Настройки"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${ICON.gear.replace(/<\/?svg[^>]*>/g,'')}</svg></button></div>`;
  // четыре цифры
  h+=`<div class="nums4">${[[days,word(days,W_DAY)+' ведёшь','days'],[fmtN(totalDone()),'шагов сделал','steps'],[cl,word(cl,W_PEAK_A)+' зажёг','peaks'],[moments,word(moments,['радость','радости','радостей']),'joy']]
    .map(([v,l,k])=>`<button data-act="numOpen" data-k="${k}"><b>${v}</b><span>${l}</span></button>`).join('')}</div>`;
  // книга
  h+=`<button class="bigbtn" data-act="openReader" style="margin-top:14px"><span class="ic">${ICON.book}</span><span><b>Книга жизни</b><small>вся история: звёзды, уроки, радости, письма</small></span></button>`;
  // колесо
  const cur=wheelNow(),prev=wheelPrev(),ids=S.spheres.length?S.spheres:SPHERES.map(s=>s.id),N=ids.length;
  const sel=ids[Math.min(ui.wsel,N-1)],CX=170,CY=170,R0=42,R1=126,ang=i=>-Math.PI/2+i*2*Math.PI/N,rOf=v=>R0+(R1-R0)*v/10;
  const arc=(r0,r1,a0,a1)=>{const q=(r,a)=>[CX+Math.cos(a)*r,CY+Math.sin(a)*r];const[x0,y0]=q(r1,a0),[x1,y1]=q(r1,a1),[x2,y2]=q(r0,a1),[x3,y3]=q(r0,a0);return `M${x0} ${y0}A${r1} ${r1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`};
  let sv='';for(let k=1;k<=5;k++)sv+=`<circle cx="${CX}" cy="${CY}" r="${R0+(R1-R0)*k/5}" fill="none" stroke="var(--line)"/>`;
  ids.forEach((id,i)=>{const s=SPH[id],c=id==='self'?'self':s.emo,a0=ang(i)+.04,a1=ang(i+1)-.04,am=(a0+a1)/2;
    sv+=`<path d="${arc(R0,R1,a0,a1)}" fill="var(--${c})" opacity=".08"/><path data-act="wsel" data-i="${i}" style="cursor:pointer" d="${arc(R0,rOf(cur[id]||5),a0,a1)}" fill="var(--${c})" opacity="${id===sel?1:.7}"/>
    <text class="lbl ${id===sel?'on':''}" data-act="wsel" data-i="${i}" x="${CX+Math.cos(am)*(R1+20)}" y="${CY+Math.sin(am)*(R1+20)}" text-anchor="middle" dominant-baseline="middle">${s.name.split(' ')[0]}</text>`});
  if(prev&&ids.every(id=>prev[id])){const pts=ids.map((id,i)=>{const am=(ang(i)+ang(i+1))/2,r=rOf(prev[id]);return `${CX+Math.cos(am)*r},${CY+Math.sin(am)*r}`}).join(' ');
    sv+=`<polygon points="${pts}" fill="none" stroke="var(--ink)" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="4 4"/>`}
  sv+=`<circle cx="${CX}" cy="${CY}" r="${R0-6}" fill="var(--bg)" stroke="var(--line)"/>`;
  const avg=ids.reduce((a,id)=>a+(cur[id]||5),0)/N,delta=prev&&prev[sel]!==undefined?cur[sel]-prev[sel]:null;
  const low=ids.slice().sort((a,b)=>(cur[a]||5)-(cur[b]||5))[0];
  h+=`<div class="blkHead"><h2>Колесо жизни</h2><span>${MON_NOM[kdate(today()).getMonth()].toLowerCase()}</span></div><div class="card">
   <div class="wheelBox"><svg viewBox="0 0 340 340" role="img" aria-label="Колесо жизни">${sv}</svg><div class="mid"><b>${Math.round(avg*10)}%</b><span>доволен</span></div></div>
   <div class="row" style="margin-top:10px;padding-top:12px;border-top:1px solid var(--line)"><div style="flex:1"><div class="muted" style="font-size:12px">Насколько ты доволен сейчас</div><b style="font-size:16px">${SPH[sel].name}</b>
   ${delta!==null?`<div style="font-size:12px;font-weight:700;color:${delta>0?'var(--grow)':delta<0?'var(--hard)':'var(--muted)'}">${delta>0?'+'+delta:delta<0?'−'+(-delta):'без изменений'} за месяц</div>`:''}</div>
   <div class="stepper"><button data-act="wstep" data-v="-1" aria-label="Меньше">−</button><output>${cur[sel]||5}</output><button data-act="wstep" data-v="1" aria-label="Больше">+</button></div></div>
   <div class="banner" style="margin:12px 0 0">Ниже всего сейчас <b>${SPH[low].name}</b> — и это нормально, когда идёшь к звезде. Перекос не ошибка, а выбор.
   <div class="row" style="margin-top:8px;gap:8px"><button class="small-btn" data-act="addGoal" data-sphere="${low}">Звезда сюда</button><button class="small-btn" style="background:transparent;border:1px solid var(--line);color:var(--ink)" data-act="ask" data-q="Что сделать, чтобы подтянуть сферу «${SPH[low].name}»?">Разобрать</button></div>
   <span class="quote" style="display:block;text-align:left;margin:10px 0 0">«Везёт тому, кто доволен своей жизнью»</span></div></div>`;
  // портрет
  h+=`<div class="blkHead"><h2>Твой портрет</h2><span>${p?esc(p.sign)+' · '+esc(p.elName):'по дате рождения'}</span></div>`;
  h+=p?portraitCard(p):`<div class="card"><div class="empty">Добавь дату рождения — соберём карту: стихию, планету, числа и личный год.<br><br><button class="small-btn" data-act="addBirth">Добавить дату</button></div></div>`;
  $('#meBody').innerHTML=h;
}
A.numOpen=el=>{const k=el.dataset.k;
  const row=(t,s,d,c)=>`<div class="ev c-${c||'grow'}"><span class="d"></span><div class="tx"><b>${esc(t)}</b>${s?`<small>${esc(s)}</small>`:''}</div><time>${d?ruDate(d):''}</time></div>`;
  if(k==='steps'){let items=[];
    Object.entries(S.days).forEach(([dt,d])=>d.tasks.filter(t=>t.status==='done'&&!t.goalId).forEach(t=>items.push({t:t.text,s:(SPH[t.sphere]||{}).name,d:dt,c:t.type==='soul'?'calm':(SPH[t.sphere]||{}).emo})));
    S.goals.forEach(g=>g.log.filter(x=>x.text!=='Путь начат').forEach(x=>items.push({t:x.text,s:g.name,d:x.date,c:x.kind})));
    items=items.sort((a,b)=>b.d.localeCompare(a.d)).map(x=>row(x.t,x.s,x.d,x.c));
    sheet(`<h3>Все шаги</h3><p class="lead">${fmtN(totalDone())} ${word(totalDone(),W_STEP)} с начала пути.</p><div class="card">${items.slice(0,80).join('')||'<div class="empty">Пока пусто.</div>'}</div>`);return}
  if(k==='peaks'){const cl=closedGoals();
    sheet(`<h3>Зажжённые звёзды</h3><p class="lead">${cl.length?'Нажми, чтобы пережить момент.':'Первая ещё впереди.'}</p>${cl.map(g=>`<button class="peakcard closed" data-act="replayPeak" data-id="${g.id}">${miniMount(1,'joy')}<span class="tx"><b>${esc(g.name)}</b><small>${ruDate(g.closed)} · ${esc(peakSummary(g))}</small></span></button>`).join('')||'<div class="card"><div class="empty">Пока пусто.</div></div>'}`);return}
  if(k==='joy'){const items=S.feed.filter(f=>f.type==='moment').slice().reverse();
    sheet(`<h3>Радости</h3><p class="lead">То, ради чего всё.</p><div class="card">${items.map(f=>row(f.title,f.text,f.date,'love')).join('')||'<div class="empty">Пока пусто.</div>'}</div>`);return}

  sheet(`<h3>Твой путь</h3><p class="lead">${daysBetween(S.created||today(),today())+1} ${word(daysBetween(S.created||today(),today())+1,W_DAY)} в приложении.</p>

  <div class="card">${items.map(f=>row(f.title,f.text,f.date,f.kind)).join('')||'<div class="empty">Пока пусто.</div>'}</div>`)};

/* ---- наставник ---- */
function mentorHints(){
  const out=[],g=activeGoals()[0],d=S.days[today()];
  if(g&&daysBetween(g.log[g.log.length-1].date,today())>=7)out.push(`Звезда «${g.name}» стоит на месте. Что делать?`);
  if(d&&d.mood==='Тяжело')out.push('Тяжёлый день. Как пройти его правильно?');
  if(lessonsList().length)out.push('Как не бросить после неудачи?');
  out.push('Как дойти до своей звезды?','Как совмещать дела и близких?');
  return out.slice(0,3);
}
const MENTOR_DEMO={
  def:'Разбей задачу на один маленький шаг, который можно сделать сегодня, и отметь его в дне. В Telegram-версии здесь ответит ИИ, который знает твой путь: звёзды, шаги и трудности.'};
function mentorContext(){
  const d=S.days[today()];
  const data={имя:S.profile.name,этап:S.profile.stage,рядом:S.profile.who,мечта:S.profile.dream,ритм:S.profile.time,восстанавливает:S.profile.restore,после_неудачи:S.profile.fail,
    сферы:S.spheres.map(id=>SPH[id].name),направления:S.dirs,
    звёзды:activeGoals().map(g=>({название:g.name,этап:`${stageIdx(g)+1} из ${g.stages.length}: ${(g.stages[stageIdx(g)]||{}).name||'звезда'}`,шагов:g.steps,деньги:g.money?`${g.money.saved} из ${g.money.target}`:null})),
    взято:closedGoals().map(g=>g.name),мечты:S.dreams.map(d=>d.name),
    сегодня:d?{дела:d.tasks.map(t=>`${t.text} — ${t.status||'в плане'}`)}:null,
    уроки:lessonsList().slice(-3).map(f=>`${f.title}. ${f.text}`),серия:streak()};
  return `Ты — наставник в приложении «Моя реальность». Оно помогает человеку наводить порядок в жизни маленькими ежедневными шагами к своим звёздам во всех сферах: здоровье, близкие, дело, деньги, дом, отдых. Пользуются им и школьники, и студенты, и родители с детьми, и пенсионеры.
Принципы: любая попытка — победа; что бы ни случилось, это опыт, который сильнее размышлений без действия; маленький шаг лучше рывка; решения проверяем, а не принимаем на эмоциях.
Отвечай по-русски, на «ты», тепло и спокойно, как мудрый друг. Коротко: 3–6 предложений, без markdown и заголовков. Заканчивай одним конкретным маленьким шагом. Опирайся на данные человека, но не пересказывай их. Не ставь диагнозов и не давай финансовых гарантий; при серьёзных вопросах здоровья, денег или права советуй специалиста. Если человек пишет о желании навредить себе или о безнадёжности — сначала поддержи и предложи обратиться к близким или на линию помощи.
Данные человека: ${JSON.stringify(data).slice(0,5000)}`;
}
A.chat=()=>renderChat();
A.ask=el=>{renderChat();sendMentor(el.dataset.q)};
function renderChat(){
  const used=S.mentor[monthKey(today())]||0,left=S.plus?'∞':Math.max(0,LIMITS.mentor-used);
  sheet(`<div class="row" style="padding-bottom:10px;border-bottom:1px solid var(--line)"><div class="orb" style="width:34px;height:34px"></div><b style="flex:1">Наставник</b><span class="c-joy" style="font-size:12px;font-weight:800" id="chatLeft">${left}</span></div>
  <div class="msgs" id="msgs" aria-live="polite">${S.chat.length?S.chat.map(m=>`<div class="m ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join(''):`<div class="m a">Привет, ${esc(S.profile.name)}. О чём подумаем?</div>`}</div>
  <div class="chips" style="margin:6px 0 10px">${mentorHints().map(q=>`<button class="chip" data-act="askIn" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
  <div class="row"><input class="field" id="chatIn" placeholder="Напиши вопрос" maxlength="600"><button class="small-btn" style="padding:13px 16px" data-act="sendChat">→</button></div>`);
  const m=$('#msgs');m.scrollTop=m.scrollHeight;$('#chatIn').onkeydown=e=>{if(e.key==='Enter')A.sendChat()};
}
A.askIn=el=>sendMentor(el.dataset.q);
A.sendChat=()=>{const v=$('#chatIn').value.trim();if(v){$('#chatIn').value='';sendMentor(v)}};
async function sendMentor(q){
  if(ui.busy)return;const mk=monthKey(today()),used=S.mentor[mk]||0,msgs=$('#msgs');
  const add=(cls,t)=>{const d=document.createElement('div');d.className='m '+cls;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d};
  if(!S.plus&&used>=LIMITS.mentor){add('a','Вопросы в этом месяце закончились. В «Моя реальность+» наставник отвечает без ограничений.');return}
  add('u',q);S.chat.push({role:'user',content:q});
  const b=add('a wait','Думаю…');ui.busy=true;let answer='';
  if(SAMPLE){
    try{const turns=[{role:'user',content:mentorContext()},...S.chat.slice(-9).map(m=>({role:m.role,content:m.content}))];
      const r=await SAMPLE(turns,{cache:false,onText:({text})=>{b.classList.remove('wait');b.textContent=text;msgs.scrollTop=msgs.scrollHeight}});answer=r.text}
    catch(e){answer=(e&&e.text)||'';if(!answer){answer=MENTOR_DEMO.def;if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled'].includes(e.code))SAMPLE=null}}
  }else{await new Promise(r=>setTimeout(r,REDUCE?0:700));answer=MENTOR_DEMO.def}
  b.classList.remove('wait');b.textContent=answer;S.chat.push({role:'assistant',content:answer});S.chat=S.chat.slice(-20);
  S.mentor[mk]=used+1;save();ui.busy=false;haptic('light');
  const l=$('#chatLeft');if(l)l.textContent=S.plus?'∞':Math.max(0,LIMITS.mentor-used-1);
}
